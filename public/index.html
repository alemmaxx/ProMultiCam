<!DOCTYPE html>
<html lang="ms" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ProMultiCam</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.png" sizes="64x64">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0e0e0f">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Montserrat:wght@800&family=Bebas+Neue&family=Anton&family=Playfair+Display:wght@700&family=Lobster&family=Pacifico&family=Dancing+Script:wght@700&family=Permanent+Marker&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Bangers&family=Fredoka:wght@700&family=Baloo+2:wght@800&family=Righteous&family=Kanit:wght@800&family=Oswald:wght@700&family=Archivo+Black&family=Caveat:wght@700&family=Satisfy&family=Lalezar&family=Amiri:wght@700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="i18n.js"></script>
<script type="module" src="account.js"></script>
<script src="https://unpkg.com/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{
  --bg:#0e0e0f;--card:#171718;--card2:#1f1f21;--ink:#ebe9e4;--muted:#9b978e;--sub:#c8c4bb;--line:#2b2a28;
  --gold:#c8a45c;--gold2:#262117;--on-gold:#17130b;
  --ok:#5fb38c;--ok-soft:#17261f;--bad:#d9776b;--bad-soft:#2e1d1b;--info:#9fb1cc;--info-soft:#1c2026;
  --soft:rgba(235,233,228,.07);--soft2:rgba(235,233,228,.1);
  --f:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
img,canvas,video,svg{-webkit-user-drag:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--f);-webkit-font-smoothing:antialiased}
/* Capitalise Each Word everywhere in the interface; typed text, e-mails, file names and messages stay as written */
body{text-transform:capitalize}
button,select{text-transform:inherit}
input,textarea,.input,.msg,.mail,.nocap,.n,code,.tx b,td.mail,#chatList *,#toast,#aWho,#rcptBox *,#npop .d,.notif .d{text-transform:none}
button,input,select{font-family:var(--f)}
button{cursor:pointer}
.screen{display:none;min-height:100%}
.screen.show{display:flex;flex-direction:column}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:8px;padding:11px 16px;font:700 14px var(--f);background:var(--soft2);color:var(--ink);min-height:44px;text-decoration:none}
.btn-gold{background:var(--gold);color:var(--on-gold);font-weight:800}
.btn-sm{min-height:34px;padding:6px 11px;font-size:13px}
.btn-soft{background:var(--gold2);color:var(--gold)}
.btn-danger{background:var(--bad-soft);color:var(--bad)}
.btn:disabled{opacity:.45}
.icon-btn{width:36px;height:36px;border:0;border-radius:10px;background:var(--soft);display:inline-grid;place-items:center;color:var(--ink);flex-shrink:0}
.input,select.input{width:100%;font:15px var(--f);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px 12px;min-height:46px;outline:none}
.input:focus{border-color:var(--gold)}
label.lbl{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700;white-space:nowrap}
.chip-ok{background:var(--ok-soft);color:var(--ok)}
.chip-gold{background:var(--gold2);color:var(--gold)}
.chip-info{background:var(--info-soft);color:var(--info)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--bad);display:inline-block}
.dot.ok{background:var(--ok)}
.topbar{display:flex;align-items:center;gap:10px;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));border-bottom:1px solid var(--line);background:var(--bg)}
.topbar .t{display:flex;flex-direction:column;flex:1;min-width:0}
.topbar .k{font-size:11px;font-weight:700;letter-spacing:.4px}
.topbar .n{font-size:17px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec{font-size:13px;font-weight:800}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000e;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:99;display:none;max-width:90%;text-align:center}

/* HOME */
.hero{padding:52px 22px 22px;padding-top:max(52px,calc(env(safe-area-inset-top) + 32px));background:radial-gradient(120% 80% at 85% 10%,#1d1d1f 0%,transparent 60%),radial-gradient(90% 70% at 0% 100%,#241f16 0%,transparent 60%),var(--bg);display:flex;flex-direction:column;gap:10px}
.logo{width:64px;height:64px;border-radius:16px;background:var(--card);display:grid;place-items:center}
.tag{font-size:13px;font-weight:700;color:var(--gold);letter-spacing:.4px}
.gold-h{margin:0;font-size:46px;font-weight:800;letter-spacing:-1.5px;line-height:1;background-image:linear-gradient(180deg,#fffbe9 0%,#f3dc8e 42%,#c99a2e 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p{margin:0;font-size:14px;color:var(--sub);line-height:1.5}
.home-body{padding:0 22px 26px;display:flex;flex-direction:column;gap:12px;flex:1}
.role{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;color:var(--ink);text-align:left;width:100%}
.role.master{border-color:var(--gold)}
.role .ic{width:50px;height:50px;flex-shrink:0;border-radius:12px;display:grid;place-items:center}
.role .tx{display:flex;flex-direction:column;gap:3px;flex:1}
.role .tx b{font-size:17px;font-weight:800}
.role .tx span{font-size:13px;color:var(--sub);line-height:1.4}
.conn-card{margin-top:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.conn-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.conn-grid div{background:var(--card2);border-radius:10px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:700;text-align:center}

/* MASTER */
#master{height:100%;max-height:100dvh}
.m-body{padding:10px 16px 0;display:flex;flex-direction:column;gap:10px;flex:1;overflow-y:auto}
.stage-box{position:relative;height:44vh;min-height:250px;border-radius:14px;overflow:hidden;background:#070707;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
#stage{max-width:100%;max-height:100%;display:block}
.stage-box .tl{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap}
.stage-box .tl span{background:rgba(14,14,15,.85);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
.recbadge{position:absolute;top:10px;right:10px;background:var(--bad);color:#1a0705;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800;display:none}
.recbadge.show{display:block;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.55}}
.looks{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.looks::-webkit-scrollbar{display:none}
.looks button{flex:0 0 auto;min-height:36px;border-radius:999px;padding:6px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:700 13px var(--f);white-space:nowrap}
.looks button.on{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-height:38px;border:0;border-radius:8px;background:var(--soft2);color:var(--ink);font:700 13px var(--f)}
.seg button.on{background:var(--gold);color:var(--on-gold)}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{position:relative;height:104px;border-radius:12px;overflow:hidden;background:var(--card2);border:3px solid var(--line);padding:0}
.tile.main{border-color:var(--gold)}
.tile.sec2{border-color:var(--info)}
.tile video{width:100%;height:100%;object-fit:cover;display:block}
.tile video.r180{transform:rotate(180deg)}
.tile video.r90,.tile video.r270{position:absolute;left:50%;top:50%;object-fit:cover}
.tile video.r90{transform:translate(-50%,-50%) rotate(90deg)}
.tile video.r270{transform:translate(-50%,-50%) rotate(270deg)}
/* Director phone turned while the system screen stays put: turn the app instead */
body.ur180 #master.show,body.ur180 .sheet-wrap{transform:rotate(180deg)}
body.ur90 #master.show,body.ur90 .sheet-wrap.show,body.ur270 #master.show,body.ur270 .sheet-wrap.show{inset:auto;min-height:0;max-height:none;max-width:none;left:50%;top:50%;width:100vh;height:100vw;width:100dvh;height:100dvw}
body.ur90 #master.show,body.ur90 .sheet-wrap.show{transform:translate(-50%,-50%) rotate(90deg)}
body.ur270 #master.show,body.ur270 .sheet-wrap.show{transform:translate(-50%,-50%) rotate(270deg)}
body.ur90 .toast,body.ur270 .toast,body.ur180 .toast{top:50%;bottom:auto}
body.ur90 .toast{transform:translate(-50%,-50%) rotate(90deg)}
body.ur270 .toast{transform:translate(-50%,-50%) rotate(270deg)}
body.ur180 .toast{transform:translate(-50%,-50%) rotate(180deg)}
body.ur90 .sheet,body.ur270 .sheet{max-height:92vw}
.tile .lb{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(14,14,15,.9));padding:14px 6px 5px;font-size:12px;font-weight:700;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .nb{position:absolute;top:4px;right:4px;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:800;color:var(--on-gold);background:var(--gold)}
.tile .nb.b{background:var(--info);color:#121214}
.tile .stat{position:absolute;top:4px;left:4px;display:flex;gap:5px;align-items:center;background:rgba(14,14,15,.8);border-radius:6px;padding:2px 6px;font-size:10px;font-weight:700}
.bars{display:inline-flex;gap:1px;align-items:flex-end;height:10px}
.bars i{display:block;width:3px;border-radius:1px;background:#3d3b37}
.bars i:nth-child(1){height:4px}.bars i:nth-child(2){height:7px}.bars i:nth-child(3){height:10px}
.tile-empty{grid-column:1/-1;background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:16px;font-size:13px;color:var(--sub);line-height:1.5;text-align:center}
.hint{font-size:12px;color:var(--muted)}
.m-foot{padding:10px 16px 18px;padding-bottom:max(18px,env(safe-area-inset-bottom));display:flex;gap:8px}
.m-foot .side{width:56px;min-height:56px;border:0;border-radius:12px;background:var(--soft2);color:var(--ink);display:none;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:700 10px var(--f)}
.m-foot.rec .side{display:flex}
.m-foot.rec #draftBtn{display:flex}
.draft-bar{display:none;align-items:center;gap:8px;padding:8px 10px;margin-bottom:8px;border-radius:12px;background:rgba(14,14,15,.82);border:1px solid var(--gold);font-size:13px;color:var(--ink)}.draft-bar.show{display:flex}.draft-bar span{flex:1;min-width:0}.draft-bar button{flex:0 0 auto}
.m-foot .side.resume{background:var(--gold);color:var(--on-gold)}
#recBtn{flex:1}
.countdown{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,8,13,.55);font-size:96px;font-weight:800;color:var(--gold)}
.countdown.show{display:flex}
.recbadge.paused{background:var(--gold);color:var(--on-gold);animation:none}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink);line-height:1.4}
.check input{width:20px;height:20px;accent-color:var(--gold);flex-shrink:0;margin-top:1px}
#liveFeed{position:fixed;inset:0;background:#000;z-index:80;display:none;align-items:center;justify-content:center}
#liveFeed.show{display:flex}
#liveFeed canvas{max-width:100vw;max-height:100vh}
#liveHint{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(14,14,15,.85);color:#ebe9e4;border-radius:12px;padding:10px 14px;font-size:13px;text-align:center;max-width:90%;transition:opacity .6s}
.hdbadge{display:none;align-self:flex-start;background:var(--bad);color:#1a0705;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:800}
.hdbadge.show{display:block}
#recBtn{width:100%;min-height:56px;border:0;border-radius:12px;background:var(--gold);color:var(--on-gold);font:800 17px var(--f);letter-spacing:.3px}
#recBtn.recording{background:var(--bad);color:#1a0705}
.sheet-wrap{position:fixed;inset:0;background:rgba(5,8,13,.72);display:none;flex-direction:column;justify-content:flex-end;z-index:50}
.sheet-wrap.show{display:flex}
.sheet{background:var(--card);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:18px 16px;padding-bottom:max(24px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;max-height:85vh;overflow-y:auto}
.sheet h3{margin:0;font-size:17px;font-weight:800}
#styleSheet .sheet>*{flex-shrink:0}
#lbgGrid,#ffxGrid{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}#lbgGrid::-webkit-scrollbar,#ffxGrid::-webkit-scrollbar{display:none}
#lbgGrid .bg-opt,#ffxGrid .bg-opt{flex:0 0 58px;padding:3px;gap:2px;font-size:9.5px;line-height:1.1;text-align:center}
#lbgGrid .bg-opt i{aspect-ratio:auto;height:46px}#ffxGrid .bg-opt i{aspect-ratio:auto!important;height:40px;font-size:22px!important}
#lbgGrid .bg-opt span,#ffxGrid .bg-opt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item{display:flex;align-items:center;gap:10px;background:var(--card2);border-radius:12px;padding:12px}
.item .tx{display:flex;flex-direction:column;flex:1;min-width:0}
.item .tx b{font-size:15px}
.item .tx span{font-size:12px;color:var(--muted)}
.rec-item{flex-wrap:wrap}
.rec-item .tx b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-item .acts{flex:1 1 100%;display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.rec-item .acts .btn{width:100%;min-width:0;min-height:42px;padding:6px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.codebox{background:var(--gold2);border:1px solid var(--gold);border-radius:12px;padding:12px;display:flex;justify-content:space-between;align-items:center}
.codebox big{font-size:26px;font-weight:800;letter-spacing:4px;color:var(--gold)}
.files a{color:var(--gold);font-size:14px;word-break:break-all}

/* SLAVE CONNECT */
.s-body{padding:16px;display:flex;flex-direction:column;gap:14px;flex:1}
.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{min-height:42px;border:0;border-radius:9px;background:transparent;color:var(--ink);font:700 13px var(--f)}
.tabs button.on{background:var(--gold);color:var(--on-gold)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.master-item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--gold);border-radius:14px;padding:14px;color:var(--ink);width:100%;text-align:left}
.master-item .ic{width:44px;height:44px;border-radius:12px;background:var(--gold2);display:grid;place-items:center;flex-shrink:0}
.master-item .tx{display:flex;flex-direction:column;flex:1;gap:2px}
.master-item .tx b{font-size:16px;font-weight:800}
.master-item .tx span{font-size:12px;color:var(--muted)}
.master-item .go{background:var(--gold);color:var(--on-gold);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:800}
.scan{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* SLAVE CAM */
#slavecam{position:fixed;inset:0;background:#000}
#camVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.eco{position:absolute;inset:0;z-index:2;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#6f6b64;text-align:center;padding:24px}
.eco b{color:#9b978e;font-size:16px}.eco span{font-size:13px}
#slavecam.ecoon .eco{display:flex}#slavecam.ecoon #camVideo{visibility:hidden}
.cam-top{position:absolute;top:0;left:0;right:0;padding:16px 16px 40px;padding-top:max(16px,env(safe-area-inset-top));display:flex;flex-direction:column;gap:8px;background:transparent;text-shadow:0 1px 3px rgba(0,0,0,.9)}
.cam-top .st{display:inline-flex;align-items:center;gap:6px;background:rgba(14,14,15,.85);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.onair{align-self:flex-start;background:var(--gold);color:var(--on-gold);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:800;display:none}
.onair.show{display:block}
.cam-bot{position:absolute;left:0;right:0;bottom:0;padding:40px 16px 24px;padding-bottom:max(24px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;background:transparent;text-shadow:0 1px 3px rgba(0,0,0,.9)}
.cam-bot .g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cam-bot .g3 .btn{background:rgba(235,233,228,.12);font-size:13px;padding:8px}
input[type=range]{accent-color:var(--gold);width:100%}

/* Director: full-phone main view */
#master.show{position:fixed;inset:0;background:#070605}
.stage-full{position:absolute;inset:0;overflow:hidden;background:radial-gradient(75% 40% at 100% 0%,rgba(200,164,92,.16),transparent 70%),radial-gradient(70% 35% at 0% 100%,rgba(200,164,92,.10),transparent 70%),linear-gradient(180deg,#14110b 0%,#0a0907 55%,#060504 100%)}
/* the picture sits between the top bar and the bottom controls, so nothing in the video is hidden or darkened */
.stage-full #stage{position:absolute;left:0;right:0;top:var(--ovt,0px);bottom:var(--ovb,0px);width:100%;height:calc(100% - var(--ovt,0px) - var(--ovb,0px));object-fit:contain;display:block}
#stageOv{position:absolute;left:0;right:0;top:var(--ovt,0px);bottom:var(--ovb,0px);width:100%;height:calc(100% - var(--ovt,0px) - var(--ovb,0px));object-fit:contain;pointer-events:none;display:none}
#stageOv.on{display:block}
.ov-top{position:absolute;top:0;left:0;right:0;padding:10px 12px 10px;padding-top:max(10px,env(safe-area-inset-top));display:flex;gap:8px;align-items:center;background:#0e0e0f;z-index:3}
.ov-top .icon-btn{background:rgba(14,14,15,.55);width:40px;height:40px}
.ov-tags{position:absolute;left:12px;top:calc(max(10px,env(safe-area-inset-top)) + 54px);display:flex;gap:6px;flex-wrap:wrap;z-index:3}
.ov-tags span{background:rgba(14,14,15,.8);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
.ov-tags span:empty{display:none}
#master .recbadge{top:calc(max(10px,env(safe-area-inset-top)) + 54px);right:12px;z-index:3}
.zoomv{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:44px;height:200px;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:3}
.zoomv span{font-size:11px;font-weight:800;color:var(--gold);background:rgba(14,14,15,.75);border-radius:8px;padding:2px 5px}
.zoomv input{width:170px;transform:rotate(-90deg) translateX(-80px);transform-origin:center;margin-top:70px}
.ov-bot{position:absolute;left:0;right:0;bottom:0;padding-top:8px;background:#0e0e0f;z-index:3}
#tileHint{display:block;padding:0 12px 6px;font-size:11px;color:var(--sub)}
.strip{display:flex;gap:8px;overflow-x:auto;padding:0 12px 8px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip .tile{flex:0 0 66px;height:88px;border-width:2px;border-radius:10px}
.strip .tile .lb{font-size:10px;padding:12px 4px 3px}
.strip .tile .nb{font-size:9px;padding:0 4px;top:auto;bottom:22px;right:3px}
.strip .tile .stat{font-size:9px;top:2px;left:2px;padding:1px 4px;gap:3px}

.shelp{position:fixed;inset:0;z-index:110;background:rgba(5,8,13,.82);display:none;align-items:center;justify-content:center;padding:14px}
.shelp.show{display:flex}
.shcard{width:100%;max-width:440px;max-height:96%;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.shbody{display:flex;gap:14px;align-items:flex-start}
.shtx{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}.shtx b{font-size:18px;line-height:1.2}
.shtx ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--sub);line-height:1.4}
.shnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.shnav .dots{display:flex;gap:5px}.shnav .dots i{width:7px;height:7px;border-radius:99px;background:var(--line)}.shnav .dots i.on{background:var(--gold);width:18px}
/* animated mini previews */
.shdemo{flex:0 0 118px}
.dm{position:relative;width:118px;aspect-ratio:9/16;border-radius:14px;overflow:hidden;background:#000;border:2px solid #2b2a28}
.dm .ang{position:absolute;inset:0;opacity:0;animation:dmCyc var(--cyc,9s) infinite;animation-delay:calc(var(--i)*var(--step,3s))}
.dm .ang:first-child{opacity:1}
@keyframes dmCyc{0%{opacity:1}31%{opacity:1}34%{opacity:0}97%{opacity:0}100%{opacity:1}}
.dm .lb{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.6);color:#fff;font-size:8px;font-weight:800;border-radius:99px;padding:2px 6px}
.dm .pan{position:absolute;left:50%;top:52%;border-radius:50%;transform:translate(-50%,-50%)}
.dm.cbars::before,.dm.cbars::after{content:'';position:absolute;left:0;right:0;height:9%;background:#000;z-index:3}.dm.cbars::before{top:0}.dm.cbars::after{bottom:0}
.dm .pip{position:absolute;right:6px;bottom:20%;width:36%;aspect-ratio:3/4;border:2px solid #c8a45c;border-radius:6px;overflow:hidden;z-index:2}
.dm .card{position:absolute;inset:0;z-index:4;background:rgba(14,14,15,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#fff;font-weight:800;font-size:11px;text-align:center;padding:6px;opacity:0;animation:dmCard var(--cyc,9s) infinite}
.dm .card i{display:block;width:22px;height:2px;background:#c8a45c}.dm .card small{color:#c8a45c;font-size:9px}
.dm .card.end{animation-name:dmEnd}
@keyframes dmCard{0%,22%{opacity:1}28%,100%{opacity:0}}
@keyframes dmEnd{0%,74%{opacity:0}80%,100%{opacity:1}}
.dm .beat{position:absolute;left:0;right:0;bottom:12%;display:flex;justify-content:center;gap:4px;z-index:4}
.dm .beat i{width:6px;height:6px;border-radius:99px;background:#c8a45c;animation:dmBeat .8s infinite}.dm .beat i:nth-child(2){animation-delay:.2s}.dm .beat i:nth-child(3){animation-delay:.4s}.dm .beat i:nth-child(4){animation-delay:.6s}
@keyframes dmBeat{0%,20%{transform:scale(1.8);opacity:1}40%,100%{transform:scale(1);opacity:.35}}
.dm .split{position:absolute;inset:0;display:grid;grid-template-rows:1fr 1fr;gap:2px;background:#c8a45c}
.dm .person{position:relative;overflow:hidden}.dm .person::before{content:'';position:absolute;left:50%;top:28%;width:28%;aspect-ratio:1;border-radius:50%;background:#e8c39e;transform:translateX(-50%)}.dm .person::after{content:'';position:absolute;left:50%;top:62%;width:60%;height:50%;border-radius:40% 40% 0 0;background:var(--shirt);transform:translateX(-50%)}
.dm .talk{position:absolute;right:8px;top:10px;width:5px;height:5px;border-radius:99px;background:#5fb38c;animation:dmBeat 1s infinite}
.dm .chip{position:absolute;left:6px;top:13%;z-index:4;background:#c8a45c;color:#17130b;font-size:8px;font-weight:800;border-radius:99px;padding:2px 6px}
.dm .tp{position:absolute;inset:0;background:rgba(7,7,7,.55);overflow:hidden}
.dm .tp div{position:absolute;left:0;right:0;padding:0 8px;color:#fff;font-size:10px;font-weight:700;line-height:1.5;text-align:center;animation:dmTp 8s linear infinite}
.dm .tp::after{content:'';position:absolute;left:0;right:0;top:34%;height:1px;background:#c8a45c}
@keyframes dmTp{0%{transform:translateY(60%)}100%{transform:translateY(-110%)}}
.dm .list{position:absolute;inset:0;background:transparent;padding:10px 8px;display:flex;flex-direction:column;gap:5px}
.dm .list span{display:block;border-radius:6px;background:rgba(23,23,24,.82);color:#c8c4bb;font-size:8px;font-weight:700;padding:5px 6px;border:1.5px solid transparent}
.dm .list span.on{border-color:#c8a45c;color:#fff;animation:dmPick 4s infinite}
@keyframes dmPick{0%,100%{background:#1f1f21}50%{background:#262117}}
.imp-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.imp-row .btn{width:100%;text-align:center;justify-content:center}
.askbox{position:fixed;inset:0;z-index:120;background:rgba(5,8,13,.75);display:none;align-items:center;justify-content:center;padding:24px}
.askbox.show{display:flex}
.askcard{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:10px}
.askcard b{font-size:18px}.askcard span{font-size:14px;color:var(--sub);line-height:1.5}
.askbtns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:6px}
.popview{position:fixed;inset:0;z-index:90;background:var(--bg);display:none;flex-direction:column}
.popview.show{display:flex}
.popview iframe{flex:1;border:0;width:100%;background:var(--bg)}

.renew-bar{border:0;border-radius:10px;background:var(--gold);color:var(--on-gold);font:800 13px var(--f);padding:8px 12px;text-align:left;min-height:38px}
.rc-row{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:8px 0;border-bottom:1px solid var(--line)}
.rc-row span:first-child{color:var(--muted)}

.dotu{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--bad);margin-left:6px}
.chat-list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:6px 2px}
.msg{max-width:82%;padding:9px 12px;border-radius:14px;font-size:14px;line-height:1.45;white-space:pre-wrap;word-break:break-word;-webkit-user-select:text;user-select:text}
.msg.me{align-self:flex-end;background:var(--gold);color:var(--on-gold);border-bottom-right-radius:4px}
.msg.them{align-self:flex-start;background:var(--card2);color:var(--ink);border-bottom-left-radius:4px}
.msg small{display:block;font-size:10px;opacity:.7;margin-top:3px}
#chatSheet .sheet{display:flex;flex-direction:column}

.bell{position:relative;padding:6px 9px}
.bell-n{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font:800 11px var(--f);display:none;align-items:center;justify-content:center;padding:0 4px}
.bell-n.on{display:flex}
.npop{position:fixed;left:12px;right:12px;top:max(12px,env(safe-area-inset-top));z-index:120;display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--gold);border-radius:14px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.5);transform:translateY(-140%);transition:transform .35s ease;cursor:pointer}
.npop.show{transform:translateY(0)}
.npop .ic{font-size:22px}.npop .tx{display:flex;flex-direction:column;min-width:0}.npop b{font-size:14px}.npop span{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.req{background:var(--card2);border-radius:12px;padding:12px;font-size:13px;color:var(--sub);line-height:1.5}
.req b{color:var(--ink)}.req ul{margin:6px 0 0;padding-left:18px}
/* ---- 3D raised buttons (pure CSS: no effect on recording speed) ---- */
:root{--b3-hi:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -2px 0 rgba(0,0,0,.32);--b3-up:0 3px 0 rgba(0,0,0,.55),0 4px 0 rgba(0,0,0,.18);--b3-dn:0 1px 0 rgba(0,0,0,.55);--b3-gold:0 3px 0 #6e5524,0 4px 0 rgba(0,0,0,.25);--b3-goldd:0 1px 0 #6e5524;--b3-sh:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,0) 50%,rgba(0,0,0,.16))}
.btn,.icon-btn,.tool,.role,.m-foot .side,#recBtn,.seg button,.looks button,.tabs button.on,.ed-tabs button,.ed-sub button.on,.bg-opt,.master-item,.btnr{background-image:var(--b3-sh);box-shadow:var(--b3-hi),var(--b3-up);transition:transform .08s,box-shadow .08s;-webkit-tap-highlight-color:transparent}
.btn-gold,#recBtn,.seg button.on,.looks button.on,.tabs button.on,.ed-tabs button.on,.m-foot .side.resume,.tool-gold,.role.master{box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -2px 0 rgba(0,0,0,.22),var(--b3-gold)}
.btn:active,.looks button:active,.icon-btn:active,.tool:active,.role:active,.m-foot .side:active,.seg button:active,.tabs button:active,.ed-tabs button:active,.ed-sub button:active,.bg-opt:active,.master-item:active,.btnr:active{transform:translateY(2px);box-shadow:var(--b3-hi),var(--b3-dn)}
.btn-gold:active,#recBtn:active,.seg button.on:active,.ed-tabs button.on:active,.tool-gold:active,.role.master:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -1px 0 rgba(0,0,0,.2),var(--b3-goldd)}
#recBtn.recording{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -2px 0 rgba(0,0,0,.22),0 3px 0 #7a2a22,0 4px 0 rgba(0,0,0,.25)}
.btn:disabled,.btn[disabled]{box-shadow:none;background-image:none;transform:none}
.ed-sub button:not(.on){box-shadow:none}
.rb-cont{font-size:10.5px!important;line-height:1.15!important;white-space:normal!important;text-align:center;padding:2px 6px!important;overflow:visible!important;text-overflow:clip!important}
.rec-item{content-visibility:auto;contain-intrinsic-size:auto 160px}
#filesSheet .sheet{overscroll-behavior:contain}
#edScreen .ed-tabs button,#edScreen .btn,.bg-opt{background-image:var(--b3-sh)}
.app-hint{display:flex;flex-direction:column;gap:2px;margin:0 0 12px;padding:12px 14px;border-radius:14px;background:#262117;border:1px solid var(--gold,#d9b44a);color:inherit;text-decoration:none}.app-hint b{color:var(--gold,#d9b44a);font-size:15px}.app-hint span{font-size:13px;opacity:.85}
</style>

<script>
/* ================= COMMON ================= */
const PFX='pmc2-';
let LANG='en';
function t(k,v){let s=(I18N[LANG]&&I18N[LANG][k])||I18N.en[k]||k;if(v)for(const x in v)s=s.split('{'+x+'}').join(v[x]);return s;}
function applyI18n(){
  document.documentElement.lang=LANG;document.documentElement.dir=LANG==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-i18n]').forEach(e=>{e.textContent=t(e.dataset.i18n);});
  document.querySelectorAll('[data-i18n-ph]').forEach(e=>e.placeholder=t(e.dataset.i18nPh));
  if(!recorder||recorder.state!=='recording')$('recBtn').textContent=t('recStart');
  [...$('autoSel').options].forEach(o=>{if(o.value!=='0'&&o.value[0]!=='b')o.textContent=t('autoN',{n:o.value});});
  if(typeof renderLooks==='function'&&$('looks').children.length)renderLooks();
  try{if($('ovGrid')&&$('ovGrid').children.length)renderOvUI();}catch(e){}
  if(typeof applyTier==='function')applyTier();
  if($('master').classList.contains('show')){renderTiles();renderConnList();refreshAudio();}
  if($('slavecam').classList.contains('show'))$('camAngleLbl').textContent=t('angleLine',{label:camLabel()});
}
function initLang(){
  let saved=null;try{saved=localStorage.getItem('pmc_lang');}catch(e){}
  try{const ql=new URLSearchParams(location.search).get('lang');if(ql){saved=ql;localStorage.setItem('pmc_lang',ql);}}catch(e){}
  const codes=LANGS.map(l=>l[0]);
  const nav=(navigator.language||'en').toLowerCase().slice(0,2);
  LANG=saved&&codes.includes(saved)?saved:(codes.includes(nav)?nav:'en');
  const sel=$('langSel');LANGS.forEach(([c,n])=>{const o=document.createElement('option');o.value=c;o.textContent=n;sel.appendChild(o);});
  sel.value=LANG;sel.onchange=()=>{LANG=sel.value;try{localStorage.setItem('pmc_lang',LANG);}catch(e){}applyI18n();try{window.edRelang&&edRelang();}catch(e){}try{if($('subEd').classList.contains('show'))seStyUI();}catch(e){}try{window.manualRelang&&manualRelang();if($('studioHelp').classList.contains('show'))renderStudioHelp();if($('guide').classList.contains('show'))paintGuide();}catch(e){}};
}
/* install as web app */
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('installBtn').style.display='flex';fitTools();});
window.addEventListener('appinstalled',()=>{track('pwa_install');setTimeout(fitTools,0);$('installBtn').style.display='none';toast(t('installed'));});
async function doInstall(){if(!deferredPrompt)return;deferredPrompt.prompt();try{await deferredPrompt.userChoice;}catch(e){}deferredPrompt=null;$('installBtn').style.display='none';fitTools();}
function initInstall(){
  const standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  if(!standalone&&ios)$('iosHint').style.display='block';
}
const LAN_SLOTS=5;
const $=id=>document.getElementById(id);
function toast(t,ms=2600){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',ms);}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('show'));$(id).classList.add('show');
  /* menu stays upright; Director and Camera may turn sideways for widescreen */
  try{if(screen.orientation){if(id==='home')screen.orientation.lock('portrait').catch(()=>{});else screen.orientation.lock('any').catch(()=>{try{screen.orientation.unlock();}catch(e){}});}}catch(e){}
  if(id==='master')setTimeout(rotateHint,800);}
let rotHintShown='';
function rotateHint(){
  const m=$('master');if(!m||!m.classList.contains('show'))return;
  const wantL=$('aspectSel').value==='l',isL=effLand(),k=wantL?'l':'p';
  if(wantL!==isL&&rotHintShown!==k){rotHintShown=k;toast(t(wantL?'rotL':'rotP'),3500);}
  if(wantL===isL)rotHintShown='';

class Saver{
  constructor(name){this.name=name;this.mem=[];this.n=0;this.q=Promise.resolve();this.ready=this.init();}
  async init(){
    try{const root=await recRoot();if(!root)return;this.dir=await root.getDirectoryHandle(this.name,{create:true});
      const fh=await this.dir.getFileHandle('_test',{create:true});const w=await fh.createWritable();await w.close();await this.dir.removeEntry('_test');}
    catch(e){this.dir=null;}
  }
  push(blob){
    if(!blob||!blob.size)return;
    this.q=this.q.then(async()=>{
      await this.ready;
      if(this.dir){try{const fh=await this.dir.getFileHandle(String(++this.n).padStart(6,'0'),{create:true});const w=await fh.createWritable();await w.write(blob);await w.close();return;}catch(e){}}
      this.mem.push(blob);
    });
  }
  async finish(type){
    await this.q;
    if(this.dir){try{await (await this.dir.getFileHandle('_done',{create:true})).createWritable().then(w=>w.close());}catch(e){}}
    const blob=this.dir?new Blob([await savedBlob(this.dir,type),...this.mem],{type}):new Blob(this.mem,{type});
    if(window.PMCNative)sendToNative(blob,this.name);
    if(this.noDl)return{blob,where:t('draftWhere')};
    downloadBlob(blob,this.name);
    return{blob,where:'Downloads/'+this.name};
  }
}

    for(let i=0;i<n;i++){const part=blob.slice(i*N,(i+1)*N);
      const b64=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(String(fr.result).split(',')[1]||'');fr.readAsDataURL(part);});
      PMCNative.put(name,b64,i===0,i===n-1);}
    toast(t('savedApp'),3500);}catch(e){console.error('native',e);}
}

    else{for(const f of parts){try{size+=(await f.getFile()).size;}catch(e){}}if(done)SIZE_CACHE[name]=[count,size];}

function drawOverlays(W,H){

/* style 1: the original recipe card (also what Free uses) */
function drawCardStyle(W,H,S,m,barH,title,price,phone,C){
  const PRO=isPro(),hasCard=!!(price||phone);let card=null;
  if(hasCard){
    const fs=Math.round(S/17),fs2=Math.round(S/24),pad=Math.round(fs*0.6);
    const cardW=W-m*2;let tl=[];if(title){ctx.font=fT(fs);tl=wrapLines(capT(title),cardW-pad*2,2);}
    const cardH=pad*2+(tl.length?fs*1.3+(tl.length-1)*fs*1.12:0)+(price?fs*1.55:0)+(phone?fs2*1.6:0);
    card={fs,fs2,pad,tl,x:m,w:cardW,h:cardH,y:H-barH-m-cardH-(window._edDrawing?(window._ovLift||0):0)};
  }
  /* a bottom logo sits in the very corner; the card moves up above it so they never overlap */
  if(logoOk()){
    const pos=$('logoPos').value,big=Math.round(S*0.2);
    const ar=logoImg.naturalWidth/logoImg.naturalHeight;let lw=big,lh=Math.round(big/ar);if(lh>big*1.2){lh=Math.round(big*1.2);lw=Math.round(lh*ar);}
    const x=pos[1]==='l'?m:W-m-lw;let y;
    if(pos[0]==='t')y=m+barH+(title&&!hasCard?Math.round(S*0.13):0);
    else{y=H-barH-m-lh-(window._edDrawing?(window._ovLift||0):0);if(card)card.y=y-Math.round(S*0.025)-card.h;}
    ctx.drawImage(logoImg,x,y,lw,lh);
  }
  if(card){
    const {fs,fs2,pad,tl,x,y,w:cardW}=card;
    ctx.save();shadowOn(S);
    let cy=y+pad;const lx=x+pad,maxW=cardW-pad*2;ctx.textAlign='left';
    if(tl.length){ctx.font=fT(fs);ctx.fillStyle='#ffffff';tl.forEach((l,i)=>ctx.fillText(l,lx,cy+fs*0.95+i*fs*1.12));cy+=fs*1.3+(tl.length-1)*fs*1.12;}
    if(price){const pf=Math.round(fs*0.9);ctx.font=fI(pf,800);const pt=fitText(price,maxW-pad),pw=ctx.measureText(pt).width+pad*1.2;
      ctx.fillStyle=C.c;rr(lx,cy+fs*0.05,pw,pf*1.35,pf*0.3);ctx.fill();ctx.save();ctx.shadowColor='transparent';ctx.fillStyle=C.ink;ctx.fillText(pt,lx+pad*0.6,cy+fs*0.05+pf*0.98);ctx.restore();cy+=fs*1.55;}
    if(phone){ctx.font=fI(fs2,800);ctx.fillStyle='#ffffff';ctx.fillText(fitText(phoneLine(phone),maxW),lx,cy+fs2*1.05);}
    ctx.restore();
  }else if(title){
    const fs=Math.round(S/15);ctx.font=fT(fs);ctx.textAlign='center';
    const tt=fitText(capT(title),W-m*4),tw=ctx.measureText(tt).width,pad=fs*0.5,ty=Math.round(H*(look.bars?0.1:0.06));
    ctx.fillStyle=C.c;ctx.globalAlpha=0.95;rr(W/2-tw/2-pad,ty,tw+pad*2,fs*1.6,fs*0.35);ctx.fill();ctx.globalAlpha=1;
    ctx.fillStyle=C.ink;ctx.fillText(tt,W/2,ty+fs*1.15);ctx.textAlign='left';
  }
}

function paintStat(s){
  if(!s.statEl)return;
  if(s.local){s.statEl.style.display='none';return;}
  const q=s.q||0,col=q>=3?'#5fb38c':q===2?'#c8a45c':q===1?'#d9776b':'#3d3b37';
  let h='<span class="bars">'+[1,2,3].map(i=>`<i style="background:${i<=q?col:'#3d3b37'}"></i>`).join('')+'</span>';
  if(s.relay)h+='<span style="color:#9fb1cc">R</span>';
  if(typeof s.batt==='number')h+=`<span style="color:${s.batt<=15&&!s.charging?'#d9776b':'#ebe9e4'}">${s.charging?'⚡':''}${s.batt}%</span>`;
  s.statEl.innerHTML=h;
}
async function pollStats(){
  for(const s of sources){
    const pc=s.call&&s.call.peerConnection;if(!pc)continue;
    try{
      const rep=await pc.getStats();let rtt=null,lost=0,recv=0,relay=false,localId=null;
      rep.forEach(r=>{
        if(r.type==='candidate-pair'&&(r.nominated||r.selected)&&r.state==='succeeded'){if(r.currentRoundTripTime!=null)rtt=r.currentRoundTripTime*1000;localId=r.localCandidateId;}
        if(r.type==='inbound-rtp'&&r.kind==='video'){lost=r.packetsLost||0;recv=r.packetsReceived||0;}
      });
      if(localId){const lc=rep.get(localId);relay=!!(lc&&lc.candidateType==='relay');}
      const dl=lost-(s._lost||0),dr=recv-(s._recv||0);s._lost=lost;s._recv=recv;
      const loss=dr+dl>0?dl/(dr+dl)*100:0;
      const q=rtt==null?2:(rtt<180&&loss<2?3:rtt<450&&loss<8?2:1);
      if(q===1&&s.q!==1&&(!s._warnQ||Date.now()-s._warnQ>60000)){s._warnQ=Date.now();toast(t('weak',{name:s.name}));}
      s.q=q;s.relay=relay;paintStat(s);
    }catch(e){}
  }
}

/* logo: remove plain background (flood fill from the edges), trim, export PNG */
function processLogo(img,removeBg){
  const k=Math.min(1,600/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*k)),h=Math.max(1,Math.round(img.height*k));
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.drawImage(img,0,0,w,h);
  if(!removeBg)return c.toDataURL('image/png');
  const im=g.getImageData(0,0,w,h),d=im.data;
  const px=(x,y)=>(y*w+x)*4;
  // already transparent around the edge? keep as is
  const corners=[px(0,0),px(w-1,0),px(0,h-1),px(w-1,h-1)];
  if(corners.every(i=>d[i+3]<30))return trimLogo(c,g,im);
  // background colour = average of edge pixels that agree with the most common corner
  let br=0,bg=0,bb=0,n=0;
  const ref=corners.map(i=>[d[i],d[i+1],d[i+2]]).sort((A,B)=>(A[0]+A[1]+A[2])-(B[0]+B[1]+B[2]))[1];
  const dist=(i,col)=>Math.sqrt((d[i]-col[0])**2+(d[i+1]-col[1])**2+(d[i+2]-col[2])**2);
  for(let x=0;x<w;x++)for(const y of [0,h-1]){const i=px(x,y);if(dist(i,ref)<60){br+=d[i];bg+=d[i+1];bb+=d[i+2];n++;}}
  for(let y=0;y<h;y++)for(const x of [0,w-1]){const i=px(x,y);if(dist(i,ref)<60){br+=d[i];bg+=d[i+1];bb+=d[i+2];n++;}}
  if(n<(w+h)*0.5)return trimLogo(c,g,im); // edge is not a plain colour: leave the image untouched
  const col=[br/n,bg/n,bb/n],TOL=42,SOFT=70;
  const seen=new Uint8Array(w*h),stack=[];
  for(let x=0;x<w;x++){stack.push(x,0,x,h-1);}for(let y=0;y<h;y++){stack.push(0,y,w-1,y);}
  while(stack.length){
    const y=stack.pop(),x=stack.pop();if(x<0||y<0||x>=w||y>=h)continue;const j=y*w+x;if(seen[j])continue;seen[j]=1;
    const i=j*4,dd=dist(i,col);
    if(dd<TOL){d[i+3]=0;stack.push(x+1,y,x-1,y,x,y+1,x,y-1);}
    else if(dd<SOFT){d[i+3]=Math.min(d[i+3],Math.round((dd-TOL)/(SOFT-TOL)*255));}
  }
  g.putImageData(im,0,0);
  return trimLogo(c,g,g.getImageData(0,0,w,h));
}
function trimLogo(c,g,im){
  const w=c.width,h=c.height,d=im.data;let x0=w,y0=h,x1=-1,y1=-1;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(d[(y*w+x)*4+3]>16){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}}
  if(x1<0)return c.toDataURL('image/png');
  const p=2;x0=Math.max(0,x0-p);y0=Math.max(0,y0-p);x1=Math.min(w-1,x1+p);y1=Math.min(h-1,y1+p);
  const o=document.createElement('canvas');o.width=x1-x0+1;o.height=y1-y0+1;o.getContext('2d').drawImage(c,x0,y0,o.width,o.height,0,0,o.width,o.height);
  return o.toDataURL('image/png');
}

    else if(d.t==='getHD')sendHD(d.id);
    else if(d.t==='fmt'){sFmt=d.v==='l'?'l':'p';fmtGuide(true);}
    else if(d.t==='zoom')camZoom(d.v);
    else if(d.t==='cc'){const tr=sStream&&sStream.getVideoTracks()[0];if(!tr){}else if(d.op==='beauty')ccBeauty(tr,$('camVideo'));else if(d.op==='beautyPref')lsSet('pmc_beauty',d.v?'1':'0');else ccDo(tr,d.op,d.v);}
    else if(d.t==='lock')setLock(!!d.on);
    else if(d.t==='rec'){if(d.on)hdStart(d.id,d.title);else hdStop();}
    else if(d.t==='q'){const hi=!!d.hi;if(hi!==sHi){sHi=hi;tuneSender(true);}}
    else if(d.t==='pause'){try{hdRec&&hdRec.state==='recording'&&hdRec.pause();}catch(e){}}
    else if(d.t==='resume'){try{hdRec&&hdRec.state==='paused'&&hdRec.resume();}catch(e){}}
    else if(d.t==='full'){sKicked=true;toast(t('studioFull'),5000);setTimeout(leave,4000);}
    else if(d.t==='kick'){sKicked=true;toast(t('kicked'));setTimeout(leave,1500);}
  });
  sConn.on('close',()=>sLost());
  sConn.on('error',()=>sLost());
}
function sLost(){
  if(sKicked)return;
  $('onAir').classList.remove('show');sStatus(false,t('lost'));
  clearTimeout(sRetry);sRetry=setTimeout(sConnect,3000);
}

if('serviceWorker' in navigator){
  const hadCtl=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').then(reg=>{
    const chk=()=>{try{reg.update();}catch(e){}};document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')chk();});setInterval(chk,30*60*1000);
  }).catch(()=>{});
  /* a newer version has taken over: offer a reload (never in the middle of a recording or export) */
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!hadCtl)return;
    const go=()=>{if(recActive()||(window._edT&&_edT.E&&_edT.E.busy)){setTimeout(go,5000);return;}
      if(document.getElementById('updBar'))return;const b=document.createElement('button');b.id='updBar';b.className='btn btn-gold';b.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom));z-index:300;box-shadow:0 6px 24px rgba(0,0,0,.5)';
      b.textContent=t('updNow');b.onclick=()=>location.reload();document.body.appendChild(b);};go();});
}
