<!DOCTYPE html>
<html lang="ms" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ProMultiCam</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.png" sizes="64x64">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0b0f17">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Montserrat:wght@800&family=Bebas+Neue&family=Anton&family=Playfair+Display:wght@700&family=Lobster&family=Pacifico&family=Dancing+Script:wght@700&family=Permanent+Marker&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="i18n.js"></script>
<script type="module" src="account.js"></script>
<script src="https://unpkg.com/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{
  --bg:#0b0f17;--card:#131a26;--card2:#1a2232;--ink:#eef0f4;--muted:#98a2b3;--sub:#c3cad6;--line:#263044;
  --gold:#d9b44a;--gold2:#2e2712;--on-gold:#1b1503;
  --ok:#2fbf8c;--ok-soft:#123528;--bad:#ef6b5c;--bad-soft:#3a1c19;--info:#7aa7f5;--info-soft:#16233b;
  --soft:rgba(238,240,244,.07);--soft2:rgba(238,240,244,.1);
  --f:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
img,canvas,video,svg{-webkit-user-drag:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--f);-webkit-font-smoothing:antialiased}
button,input,select{font-family:var(--f)}
button{cursor:pointer}
.screen{display:none;min-height:100%}
.screen.show{display:flex;flex-direction:column}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:8px;padding:11px 16px;font:700 14px var(--f);background:var(--soft2);color:var(--ink);min-height:44px;text-decoration:none}
.btn-gold{background:var(--gold);color:var(--on-gold);font-weight:800}
.btn-sm{min-height:34px;padding:6px 11px;font-size:13px}
.btn-soft{background:var(--gold2);color:var(--gold)}
.btn-danger{background:var(--bad-soft);color:var(--bad)}
.btn:disabled{opacity:.45}
.icon-btn{width:36px;height:36px;border:0;border-radius:10px;background:var(--soft);display:inline-grid;place-items:center;color:var(--ink);flex-shrink:0}
.input,select.input{width:100%;font:15px var(--f);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px 12px;min-height:46px;outline:none}
.input:focus{border-color:var(--gold)}
label.lbl{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700;white-space:nowrap}
.chip-ok{background:var(--ok-soft);color:var(--ok)}
.chip-gold{background:var(--gold2);color:var(--gold)}
.chip-info{background:var(--info-soft);color:var(--info)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--bad);display:inline-block}
.dot.ok{background:var(--ok)}
.topbar{display:flex;align-items:center;gap:10px;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));border-bottom:1px solid var(--line);background:var(--bg)}
.topbar .t{display:flex;flex-direction:column;flex:1;min-width:0}
.topbar .k{font-size:11px;font-weight:700;letter-spacing:.4px}
.topbar .n{font-size:17px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec{font-size:13px;font-weight:800}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000e;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:99;display:none;max-width:90%;text-align:center}

/* HOME */
.hero{padding:52px 22px 22px;padding-top:max(52px,calc(env(safe-area-inset-top) + 32px));background:radial-gradient(120% 80% at 85% 10%,#1c2f52 0%,transparent 60%),radial-gradient(90% 70% at 0% 100%,#2a2210 0%,transparent 60%),var(--bg);display:flex;flex-direction:column;gap:10px}
.logo{width:64px;height:64px;border-radius:16px;background:var(--card);display:grid;place-items:center}
.tag{font-size:13px;font-weight:700;color:var(--gold);letter-spacing:.4px}
.gold-h{margin:0;font-size:46px;font-weight:800;letter-spacing:-1.5px;line-height:1;background-image:linear-gradient(180deg,#fffbe9 0%,#f3dc8e 42%,#c99a2e 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p{margin:0;font-size:14px;color:var(--sub);line-height:1.5}
.home-body{padding:0 22px 26px;display:flex;flex-direction:column;gap:12px;flex:1}
.role{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;color:var(--ink);text-align:left;width:100%}
.role.master{border-color:var(--gold)}
.role .ic{width:50px;height:50px;flex-shrink:0;border-radius:12px;display:grid;place-items:center}
.role .tx{display:flex;flex-direction:column;gap:3px;flex:1}
.role .tx b{font-size:17px;font-weight:800}
.role .tx span{font-size:13px;color:var(--sub);line-height:1.4}
.conn-card{margin-top:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.conn-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.conn-grid div{background:var(--card2);border-radius:10px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:700;text-align:center}

/* MASTER */
#master{height:100%;max-height:100dvh}
.m-body{padding:10px 16px 0;display:flex;flex-direction:column;gap:10px;flex:1;overflow-y:auto}
.stage-box{position:relative;height:44vh;min-height:250px;border-radius:14px;overflow:hidden;background:#05080d;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
#stage{max-width:100%;max-height:100%;display:block}
.stage-box .tl{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap}
.stage-box .tl span{background:rgba(11,15,23,.85);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
.recbadge{position:absolute;top:10px;right:10px;background:var(--bad);color:#1a0705;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800;display:none}
.recbadge.show{display:block;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.55}}
.looks{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.looks::-webkit-scrollbar{display:none}
.looks button{flex:0 0 auto;min-height:36px;border-radius:999px;padding:6px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:700 13px var(--f);white-space:nowrap}
.looks button.on{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-height:38px;border:0;border-radius:8px;background:var(--soft2);color:var(--ink);font:700 13px var(--f)}
.seg button.on{background:var(--gold);color:var(--on-gold)}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{position:relative;height:104px;border-radius:12px;overflow:hidden;background:var(--card2);border:3px solid var(--line);padding:0}
.tile.main{border-color:var(--gold)}
.tile.sec2{border-color:var(--info)}
.tile video{width:100%;height:100%;object-fit:cover;display:block}
.tile video.r180{transform:rotate(180deg)}
.tile video.r90,.tile video.r270{position:absolute;left:50%;top:50%;object-fit:cover}
.tile video.r90{transform:translate(-50%,-50%) rotate(90deg)}
.tile video.r270{transform:translate(-50%,-50%) rotate(270deg)}
/* Director phone turned while the system screen stays put: turn the app instead */
body.ur180 #master.show,body.ur180 .sheet-wrap{transform:rotate(180deg)}
body.ur90 #master.show,body.ur90 .sheet-wrap.show,body.ur270 #master.show,body.ur270 .sheet-wrap.show{inset:auto;min-height:0;max-height:none;max-width:none;left:50%;top:50%;width:100vh;height:100vw;width:100dvh;height:100dvw}
body.ur90 #master.show,body.ur90 .sheet-wrap.show{transform:translate(-50%,-50%) rotate(90deg)}
body.ur270 #master.show,body.ur270 .sheet-wrap.show{transform:translate(-50%,-50%) rotate(270deg)}
body.ur90 .toast,body.ur270 .toast,body.ur180 .toast{top:50%;bottom:auto}
body.ur90 .toast{transform:translate(-50%,-50%) rotate(90deg)}
body.ur270 .toast{transform:translate(-50%,-50%) rotate(270deg)}
body.ur180 .toast{transform:translate(-50%,-50%) rotate(180deg)}
body.ur90 .sheet,body.ur270 .sheet{max-height:92vw}
.tile .lb{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(11,15,23,.9));padding:14px 6px 5px;font-size:12px;font-weight:700;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .nb{position:absolute;top:4px;right:4px;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:800;color:var(--on-gold);background:var(--gold)}
.tile .nb.b{background:var(--info);color:#0b1a33}
.tile .stat{position:absolute;top:4px;left:4px;display:flex;gap:5px;align-items:center;background:rgba(11,15,23,.8);border-radius:6px;padding:2px 6px;font-size:10px;font-weight:700}
.bars{display:inline-flex;gap:1px;align-items:flex-end;height:10px}
.bars i{display:block;width:3px;border-radius:1px;background:#3b4558}
.bars i:nth-child(1){height:4px}.bars i:nth-child(2){height:7px}.bars i:nth-child(3){height:10px}
.tile-empty{grid-column:1/-1;background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:16px;font-size:13px;color:var(--sub);line-height:1.5;text-align:center}
.hint{font-size:12px;color:var(--muted)}
.m-foot{padding:10px 16px 18px;padding-bottom:max(18px,env(safe-area-inset-bottom));display:flex;gap:8px}
.m-foot .side{width:56px;min-height:56px;border:0;border-radius:12px;background:var(--soft2);color:var(--ink);display:none;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:700 10px var(--f)}
.m-foot.rec .side{display:flex}
#recBtn{flex:1}
.countdown{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,8,13,.55);font-size:96px;font-weight:800;color:var(--gold)}
.countdown.show{display:flex}
.recbadge.paused{background:var(--gold);color:var(--on-gold);animation:none}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink);line-height:1.4}
.check input{width:20px;height:20px;accent-color:var(--gold);flex-shrink:0;margin-top:1px}
#liveFeed{position:fixed;inset:0;background:#000;z-index:80;display:none;align-items:center;justify-content:center}
#liveFeed.show{display:flex}
#liveFeed canvas{max-width:100vw;max-height:100vh}
#liveHint{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(11,15,23,.85);color:#eef0f4;border-radius:12px;padding:10px 14px;font-size:13px;text-align:center;max-width:90%;transition:opacity .6s}
.hdbadge{display:none;align-self:flex-start;background:var(--bad);color:#1a0705;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:800}
.hdbadge.show{display:block}
#recBtn{width:100%;min-height:56px;border:0;border-radius:12px;background:var(--gold);color:var(--on-gold);font:800 17px var(--f);letter-spacing:.3px}
#recBtn.recording{background:var(--bad);color:#1a0705}
.sheet-wrap{position:fixed;inset:0;background:rgba(5,8,13,.72);display:none;flex-direction:column;justify-content:flex-end;z-index:50}
.sheet-wrap.show{display:flex}
.sheet{background:var(--card);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:18px 16px;padding-bottom:max(24px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;max-height:85vh;overflow-y:auto}
.sheet h3{margin:0;font-size:17px;font-weight:800}
.item{display:flex;align-items:center;gap:10px;background:var(--card2);border-radius:12px;padding:12px}
.item .tx{display:flex;flex-direction:column;flex:1;min-width:0}
.item .tx b{font-size:15px}
.item .tx span{font-size:12px;color:var(--muted)}
.rec-item{flex-wrap:wrap}
.rec-item .tx b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-item .acts{flex:1 1 100%;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px}
.rec-item .acts .btn{width:100%;min-height:40px}
.codebox{background:var(--gold2);border:1px solid var(--gold);border-radius:12px;padding:12px;display:flex;justify-content:space-between;align-items:center}
.codebox big{font-size:26px;font-weight:800;letter-spacing:4px;color:var(--gold)}
.files a{color:var(--gold);font-size:14px;word-break:break-all}

/* SLAVE CONNECT */
.s-body{padding:16px;display:flex;flex-direction:column;gap:14px;flex:1}
.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{min-height:42px;border:0;border-radius:9px;background:transparent;color:var(--ink);font:700 13px var(--f)}
.tabs button.on{background:var(--gold);color:var(--on-gold)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.master-item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--gold);border-radius:14px;padding:14px;color:var(--ink);width:100%;text-align:left}
.master-item .ic{width:44px;height:44px;border-radius:12px;background:var(--gold2);display:grid;place-items:center;flex-shrink:0}
.master-item .tx{display:flex;flex-direction:column;flex:1;gap:2px}
.master-item .tx b{font-size:16px;font-weight:800}
.master-item .tx span{font-size:12px;color:var(--muted)}
.master-item .go{background:var(--gold);color:var(--on-gold);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:800}
.scan{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* SLAVE CAM */
#slavecam{position:fixed;inset:0;background:#000}
#camVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.eco{position:absolute;inset:0;z-index:2;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#6b7385;text-align:center;padding:24px}
.eco b{color:#98a2b3;font-size:16px}.eco span{font-size:13px}
#slavecam.ecoon .eco{display:flex}#slavecam.ecoon #camVideo{visibility:hidden}
.cam-top{position:absolute;top:0;left:0;right:0;padding:16px 16px 40px;padding-top:max(16px,env(safe-area-inset-top));display:flex;flex-direction:column;gap:8px;background:linear-gradient(rgba(11,15,23,.92),rgba(11,15,23,0))}
.cam-top .st{display:inline-flex;align-items:center;gap:6px;background:rgba(11,15,23,.85);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.onair{align-self:flex-start;background:var(--gold);color:var(--on-gold);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:800;display:none}
.onair.show{display:block}
.cam-bot{position:absolute;left:0;right:0;bottom:0;padding:40px 16px 24px;padding-bottom:max(24px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;background:linear-gradient(rgba(11,15,23,0),rgba(11,15,23,.95) 35%)}
.cam-bot .g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cam-bot .g3 .btn{background:rgba(238,240,244,.12);font-size:13px;padding:8px}
input[type=range]{accent-color:var(--gold);width:100%}

/* Director: full-phone main view */
#master.show{position:fixed;inset:0;background:#000}
.stage-full{position:absolute;inset:0;overflow:hidden;background:#000}
.stage-full #stage{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
#stageOv{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;display:none}
#stageOv.on{display:block}
.ov-top{position:absolute;top:0;left:0;right:0;padding:10px 12px 26px;padding-top:max(10px,env(safe-area-inset-top));display:flex;gap:8px;align-items:center;background:linear-gradient(rgba(11,15,23,.88),rgba(11,15,23,0));z-index:3}
.ov-top .icon-btn{background:rgba(11,15,23,.55);width:40px;height:40px}
.ov-tags{position:absolute;left:12px;top:calc(max(10px,env(safe-area-inset-top)) + 54px);display:flex;gap:6px;flex-wrap:wrap;z-index:3}
.ov-tags span{background:rgba(11,15,23,.8);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
.ov-tags span:empty{display:none}
#master .recbadge{top:calc(max(10px,env(safe-area-inset-top)) + 54px);right:12px;z-index:3}
.zoomv{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:44px;height:200px;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:3}
.zoomv span{font-size:11px;font-weight:800;color:var(--gold);background:rgba(11,15,23,.75);border-radius:8px;padding:2px 5px}
.zoomv input{width:170px;transform:rotate(-90deg) translateX(-80px);transform-origin:center;margin-top:70px}
.ov-bot{position:absolute;left:0;right:0;bottom:0;padding-top:28px;background:linear-gradient(rgba(11,15,23,0),rgba(11,15,23,.92) 38%);z-index:3}
#tileHint{display:block;padding:0 12px 6px;font-size:11px;color:var(--sub)}
.strip{display:flex;gap:8px;overflow-x:auto;padding:0 12px 8px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip .tile{flex:0 0 66px;height:88px;border-width:2px;border-radius:10px}
.strip .tile .lb{font-size:10px;padding:12px 4px 3px}
.strip .tile .nb{font-size:9px;padding:0 4px;top:auto;bottom:22px;right:3px}
.strip .tile .stat{font-size:9px;top:2px;left:2px;padding:1px 4px;gap:3px}
.strip .tile-empty{flex:1;font-size:12px;padding:10px;background:rgba(19,26,38,.8)}
.tile-add{flex:0 0 66px;height:88px;border:2px dashed var(--line);border-radius:10px;background:rgba(19,26,38,.7);color:var(--gold);font:800 26px var(--f)}
#master .m-foot{padding:4px 12px 14px;padding-bottom:max(14px,env(safe-area-inset-bottom))}
#master #recBtn{min-height:54px}
/* Director held sideways (widescreen): compact controls so the video fills the screen */
/* Director sideways (widescreen): compact controls. body.land = real or sensor landscape */
body.land .ov-top{padding:6px 10px 18px;padding-top:max(6px,env(safe-area-inset-top))}
body.land .ov-top .icon-btn{width:38px;height:38px}
body.land .ov-tags{top:calc(max(6px,env(safe-area-inset-top)) + 46px)}
body.land #master .recbadge{top:calc(max(6px,env(safe-area-inset-top)) + 46px)}
body.land #tileHint{display:none}
body.land .ov-bot{display:flex;align-items:flex-end;gap:10px;padding:14px 10px 0;padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right));background:linear-gradient(rgba(11,15,23,0),rgba(11,15,23,.85) 45%)}
body.land .ov-bot .strip{flex:1;min-width:0;padding:0 0 10px}
body.land .strip .tile,body.land .tile-add{flex:0 0 84px;height:58px}
body.land .strip .tile .nb{bottom:18px}
body.land #master .m-foot{flex:0 0 auto;width:min(44%,340px);padding:0 0 10px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
body.land #master #recBtn{min-height:46px;font-size:15px}
body.land .zoomv{height:150px}.zoomv input{width:120px;transform:rotate(-90deg) translateX(-55px);margin-top:50px}
body.land #home.show{overflow-y:auto}
body.land .sheet{max-height:92vh
}

.qrwrap{display:flex;gap:12px;align-items:center;background:#fff;border-radius:12px;padding:10px;color:#1b1503}
#qrBox{width:128px;height:128px;flex-shrink:0}#qrBox svg{width:100%;height:100%}
.qrwrap .tx{display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:600;line-height:1.4}

let LANG='en';
function t(k,v){let s=(I18N[LANG]&&I18N[LANG][k])||I18N.en[k]||k;if(v)for(const x in v)s=s.split('{'+x+'}').join(v[x]);return s;}
function applyI18n(){
  document.documentElement.lang=LANG;document.documentElement.dir=LANG==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-i18n]').forEach(e=>{e.textContent=t(e.dataset.i18n);});
  document.querySelectorAll('[data-i18n-ph]').forEach(e=>e.placeholder=t(e.dataset.i18nPh));
  if(!recorder||recorder.state!=='recording')$('recBtn').textContent=t('recStart');

async function hkey(x){const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(x));return [...new Uint8Array(buf)].slice(0,6).map(b=>b.toString(16).padStart(2,'0')).join('');}

/* Room keys for phones on the same Wi-Fi: the shared public IPv4 address, plus the shared IPv6 network
   prefix (/64) — some routers give each phone a different route out, but they still share one of these. */
async function lanKeys(){
  const [a,b]=await Promise.all([getIp('https://api.ipify.org?format=json'),getIp('https://api64.ipify.org?format=json')]);
  const keys=new Set();
  for(const ip of [a,b]){if(!ip)continue;
    if(ip.includes(':')){const pre=ip.split(':').slice(0,4).join(':').toLowerCase();keys.add(await hkey('pmc6|'+pre));}

}

class Saver{
  constructor(name){this.name=name;this.mem=[];this.n=0;this.q=Promise.resolve();this.ready=this.init();}
  async init(){
    try{const root=await recRoot();if(!root)return;this.dir=await root.getDirectoryHandle(this.name,{create:true});
      const fh=await this.dir.getFileHandle('_test',{create:true});const w=await fh.createWritable();await w.close();await this.dir.removeEntry('_test');}
    catch(e){this.dir=null;}
  }
  push(blob){
    if(!blob||!blob.size)return;
    this.q=this.q.then(async()=>{
      await this.ready;
      if(this.dir){try{const fh=await this.dir.getFileHandle(String(++this.n).padStart(6,'0'),{create:true});const w=await fh.createWritable();await w.write(blob);await w.close();return;}catch(e){}}

  }

    await this.q;
    if(this.dir){try{await (await this.dir.getFileHandle('_done',{create:true})).createWritable().then(w=>w.close());}catch(e){}}
    const blob=this.dir?new Blob([await savedBlob(this.dir,type),...this.mem],{type}):new Blob(this.mem,{type});
    downloadBlob(blob,this.name);

function ovFontKey(){const v=$('ovFont')?$('ovFont').value:'';return isPro()&&OV_FONTS[v]?v:'bricolage';}
/* title font = chosen font; info font (price, phone) stays easy to read when the title font is handwriting */
function fT(px){const f=OV_FONTS[ovFontKey()];return `${f.w} ${Math.round(px)}px ${f.fam},"Bricolage Grotesque",sans-serif`;}
function fI(px,w){const f=OV_FONTS[ovFontKey()];const g=f.script?OV_FONTS.poppins:f;return `${w||g.w} ${Math.round(px)}px ${g.fam},"Bricolage Grotesque",sans-serif`;}
function capT(x){return OV_FONTS[ovFontKey()].caps?x.toUpperCase():x;}
function loadOvFont(){const f=OV_FONTS[ovFontKey()];try{document.fonts.load(`${f.w} 40px ${f.fam}`);document.fonts.load(`700 40px Poppins`);}catch(e){}}
function renderOvUI(){
  const g=$('ovGrid');if(!g)return;const cur=$('ovStyle').value||'card';
  if(!g.children.length){OV_STYLES.forEach((k,i)=>{const b=document.createElement('button');b.type='button';b.dataset.k=k;b.innerHTML='<b></b><span></span>';b.onclick=()=>{$('ovStyle').value=k;const f=$('ovFont');if(!f.dataset.touched)f.value=OV_DEF_FONT[k];renderOvUI();loadOvFont();};g.appendChild(b);});
    const cs=$('ovColors');Object.entries(OV_COLORS).forEach(([k,v])=>{const b=document.createElement('button');b.type='button';b.dataset.k=k;b.style.background=v.c;b.setAttribute('aria-label',t('col_'+k));b.onclick=()=>{$('ovColor').value=k;renderOvUI();};cs.appendChild(b);});
    const fs=$('ovFont');Object.entries(OV_FONTS).forEach(([k,v])=>{const o=document.createElement('option');o.value=k;o.style.fontFamily=v.fam;fs.appendChild(o);});
    fs.onchange=()=>{fs.dataset.touched='1';loadOvFont();};}
  [...g.children].forEach((b,i)=>{const k=b.dataset.k;b.classList.toggle('on',k===cur);b.querySelector('b').textContent=(i+1)+'. '+t('ov_'+k);b.querySelector('span').textContent=t('ovd_'+k);});
  [...$('ovColors').children].forEach(b=>b.classList.toggle('on',b.dataset.k===($('ovColor').value||'gold')));
  [...$('ovFont').options].forEach(o=>o.textContent=t('font_'+o.value));if(!$('ovFont').value)$('ovFont').value='bricolage';
  $('shopRow').style.display=['band','menu','minimal','polaroid','gold','panel'].includes(cur)?'flex':'none';
  $('descRow').style.display=cur==='panel'?'flex':'none';$('menuRow').style.display=cur==='menu'?'flex':'none';$('spkHint').style.display=cur==='speaker'?'block':'none';
}
function videoRect(W,H){
  if(cleanRec&&recorder&&recorder.state!=='inactive'&&!window._edDrawing)return {x:0,y:0,w:W,h:H};
  const st=ovStyle(),P=H>W;
  if(st==='polaroid')return P?{x:W*.07,y:H*.045,w:W*.86,h:H*.74,bg:'#f4efe6'}:{x:W*.04,y:H*.06,w:W*.92,h:H*.72,bg:'#f4efe6'};
  if(st==='panel')return P?{x:0,y:0,w:W,h:H*.68,bg:'#0b0f17'}:{x:0,y:0,w:W*.64,h:H,bg:'#0b0f17'};
  return {x:0,y:0,w:W,h:H};
}
function logoOk(){return isPro()&&logoImg&&logoImg.complete&&logoImg.naturalWidth;}
function drawLogoAt(x,y,box,alpha){if(!logoOk())return 0;const ar=logoImg.naturalWidth/logoImg.naturalHeight;let lw=box,lh=Math.round(box/ar);if(lh>box){lh=box;lw=Math.round(box*ar);}ctx.save();if(alpha)ctx.globalAlpha=alpha;ctx.drawImage(logoImg,x+(box-lw)/2,y+(box-lh)/2,lw,lh);ctx.restore();return box;}
function shadowOn(S){ctx.shadowColor='rgba(0,0,0,.75)';ctx.shadowBlur=Math.round(S*0.018);ctx.shadowOffsetY=Math.round(S*0.003);}
function menuItems(){return ($('menuTxt')?$('menuTxt').value:'').split('\n').map(l=>l.trim()).filter(Boolean).slice(0,4).map(l=>{const m=l.match(/^(.*?)[\s]*[-–:|][\s]*((?:RM)?\s*[\d.,]+.*)$/i);return m?[m[1],m[2]]:[l,''];});}
function drawOverlays(W,H){
  const S=Math.min(W,H),m=Math.round(S*0.045),barH=look.bars?Math.round(H*0.08):0,PRO=isPro(),P=H>W;
  const title=$('titleTxt').value.trim(),price=PRO?$('priceTxt').value.trim():'',phone=PRO?$('phoneTxt').value.trim():'';
  const shop=PRO&&$('shopTxt')?$('shopTxt').value.trim():'',desc=PRO&&$('descTxt')?$('descTxt').value.trim():'';
  const st=ovStyle(),C=ovCol(),info=[price,phone?t('orderVia',{p:phone}):''].filter(Boolean).join('  ·  ');

  if(st==='band'){
    const bh=Math.round(S*0.17),y=low-bh;ctx.fillStyle='rgba(11,15,23,.9)';ctx.fillRect(0,y,W,bh);ctx.fillStyle=C.c;ctx.fillRect(0,y,W,Math.max(3,S*0.008));
    let x=m;const lb=logoOk()?Math.round(bh*0.7):0;if(lb){drawLogoAt(x,y+(bh-lb)/2,lb);x+=lb+m*0.6;}
    const mw=W-x-m;ctx.fillStyle='#fff';ctx.font=fT(bh*0.32);ctx.fillText(fitText(capT(title||shop),mw),x,y+bh*0.48);
    ctx.fillStyle=C.c;ctx.font=fI(bh*0.22);ctx.fillText(fitText(info,mw),x,y+bh*0.8);return;
  }
  if(st==='promo'){
    drawLogoAt(m,m+barH,Math.round(S*0.18));
    if(price){const r=Math.round(S*0.14),cx=W-m-r,cy=m+barH+r;ctx.save();ctx.translate(cx,cy);ctx.rotate(-0.17);ctx.fillStyle=C.c;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=C.ink;ctx.textAlign='center';ctx.font=fI(r*0.26,800);ctx.fillText(t('ovPromo'),0,-r*0.28);ctx.font=fT(r*0.5);ctx.fillText(fitText(capT(price),r*1.7),0,r*0.32);ctx.restore();}
    ctx.save();shadowOn(S);ctx.fillStyle='#fff';ctx.font=fT(S/12);ctx.fillText(fitText(capT(title),W-m*2),m,low-(phone?S*0.08:0));
    if(phone){ctx.font=fI(S/24);ctx.fillText(fitText(t('orderVia',{p:phone}),W-m*2),m,low);}ctx.restore();return;
  }
  if(st==='menu'){
    drawLogoAt(W-m-Math.round(S*0.18),m+barH,Math.round(S*0.18));
    let items=menuItems();if(!items.length&&(title||price))items=[[title,price]];
    const fs=Math.round(S/24),pad=Math.round(fs*0.8),rowH=fs*1.55,w=W-m*2,h=pad*2+fs*1.4+items.length*rowH+(phone?fs*1.4:0),y=low-h;
    ctx.fillStyle='rgba(11,15,23,.88)';rr(m,y,w,h,fs*0.6);ctx.fill();ctx.strokeStyle=C.c;ctx.lineWidth=Math.max(2,S*0.004);rr(m,y,w,h,fs*0.6);ctx.stroke();
    let cy=y+pad+fs;ctx.fillStyle=C.c;ctx.font=fT(fs*1.05);ctx.fillText(fitText(capT(shop||t('ovMenu')),w-pad*2),m+pad,cy);cy+=fs*1.4;
    items.forEach(([n,pr])=>{ctx.fillStyle='#fff';ctx.font=fI(fs,600);ctx.textAlign='left';ctx.fillText(fitText(n,w*0.62),m+pad,cy);ctx.textAlign='right';ctx.fillStyle=C.c;ctx.font=fI(fs,800);ctx.fillText(pr,m+w-pad,cy);cy+=rowH;});
    if(phone){ctx.textAlign='left';ctx.fillStyle='#c3cad6';ctx.font=fI(fs*0.85,600);ctx.fillText(fitText(t('orderVia',{p:phone}),w-pad*2),m+pad,cy);}return;
  }
  if(st==='flash'){
    const bh=Math.round(S*0.11);ctx.fillStyle=C.c;ctx.fillRect(0,barH,W,bh);ctx.fillStyle=C.ink;ctx.textAlign='center';ctx.font=fT(bh*0.5);
    ctx.fillText(fitText(capT(t('ovFlash')+(price?'  ·  '+price:'')),W-m*2),W/2,barH+bh*0.68);
    ctx.font=fI(S/30,700);const tg=t('ovStock'),tw=ctx.measureText(tg).width+S*0.04;ctx.fillStyle='rgba(11,15,23,.85)';rr(W-m-tw,barH+bh+m*0.5,tw,S*0.06,S*0.015);ctx.fill();ctx.fillStyle=C.c==='#ffffff'?'#d9b44a':C.c;ctx.fillText(tg,W-m-tw/2,barH+bh+m*0.5+S*0.042);
    const ch=Math.round(S*0.12),cy=low-ch;ctx.fillStyle=C.c;rr(m,cy,W-m*2,ch,ch*0.25);ctx.fill();ctx.fillStyle=C.ink;ctx.font=fI(ch*0.36,800);ctx.fillText(fitText(phone?t('orderVia',{p:phone}):(title||''),W-m*4),W/2,cy+ch*0.63);
    if(title&&phone){ctx.save();shadowOn(S);ctx.fillStyle='#fff';ctx.font=fT(S/13);ctx.fillText(fitText(capT(title),W-m*2),W/2,cy-S*0.04);ctx.restore();}
    ctx.textAlign='left';return;
  }
  if(st==='minimal'){
    const lb=Math.round(S*0.11);drawLogoAt(W-m-lb,low-lb,lb,0.85);
    if(shop||title){ctx.save();ctx.globalAlpha=0.85;shadowOn(S);ctx.fillStyle='#fff';ctx.font=fI(S/28,600);ctx.fillText(fitText(shop||title,W*0.6),m,low-S*0.02);ctx.restore();}return;
  }
  if(st==='polaroid'){
    const R=videoRect(W,H),by=R.y+R.h,rest=H-by;ctx.textAlign='center';
    ctx.fillStyle='#2b1d12';ctx.font=fT(Math.min(rest*0.3,S/10));ctx.fillText(fitText(capT(title||shop),W*0.9),W/2,by+rest*0.42);
    ctx.fillStyle='#7a5a32';ctx.font=fI(Math.min(rest*0.15,S/24),600);ctx.fillText(fitText(info,W*0.9),W/2,by+rest*0.7);
    drawLogoAt(R.x+R.w-m-Math.round(S*0.13),R.y+m,Math.round(S*0.13));ctx.textAlign='left';return;

  if(st==='gold'){
    const ins=Math.round(S*0.02);ctx.strokeStyle=C.c;ctx.lineWidth=Math.max(3,S*0.008);rr(ins,ins+barH,W-ins*2,H-ins*2-barH*2,S*0.03);ctx.stroke();
    if(shop||logoOk()){ctx.font=fT(S/24);const tx=capT(shop),tw=Math.max(ctx.measureText(tx).width,shop?0:S*0.1)+S*0.08,th=S*0.075;ctx.fillStyle=C.c;rr(W/2-tw/2,barH,tw,th,S*0.02);ctx.fill();
      if(shop){ctx.fillStyle=C.ink;ctx.textAlign='center';ctx.fillText(tx,W/2,barH+th*0.7);}else drawLogoAt(W/2-th*0.45,barH+th*0.05,th*0.9);}
    if(shop&&logoOk())drawLogoAt(W-m-Math.round(S*0.15),barH+m+S*0.06,Math.round(S*0.15));
    ctx.save();shadowOn(S);ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font=fT(S/11);ctx.fillText(fitText(capT(title),W-m*3),W/2,low-S*0.07);
    ctx.fillStyle=C.c;ctx.font=fI(S/24);ctx.fillText(fitText(info,W-m*3),W/2,low);ctx.restore();ctx.textAlign='left';return;
  }
  if(st==='panel'){
    const R=videoRect(W,H),px=P?0:R.w,py=P?R.h:0,pw=P?W:W-R.w,ph=P?H-R.h:H,pad=Math.round(S*0.05);
    ctx.fillStyle=C.c;if(P)ctx.fillRect(0,py,W,Math.max(3,S*0.008));else ctx.fillRect(px,0,Math.max(3,S*0.008),H);
    let x=px+pad,y=py+pad;const lb=logoOk()?Math.round(S*0.1):0;if(lb){drawLogoAt(x,y,lb);}
    const tx=lb?x+lb+pad*0.5:x,tw=px+pw-pad-tx;ctx.fillStyle='#fff';ctx.font=fT(P?S/16:Math.min(S/16,pw/10));ctx.fillText(fitText(capT(title||shop),tw),tx,y+(lb?lb*0.62:S/16));
    y+=Math.max(lb,S/16)+pad*0.6;
    if(desc){ctx.fillStyle='#98a2b3';ctx.font=fI(S/30,500);ctx.fillText(fitText(desc,pw-pad*2),x,y+S/30);y+=S/30*1.8;}
    const by=py+ph-pad-S*0.075;
    if(price){ctx.fillStyle=C.c;ctx.font=fI(S/16,800);ctx.fillText(fitText(price,pw*0.45),x,by+S*0.058);}
    if(phone){ctx.font=fI(S/30,800);const bt=t('ovOrder'),bw=ctx.measureText(bt).width+S*0.06;ctx.fillStyle=C.c;rr(px+pw-pad-bw,by,bw,S*0.075,S*0.018);ctx.fill();ctx.fillStyle=C.ink;ctx.textAlign='center';ctx.fillText(bt,px+pw-pad-bw/2,by+S*0.05);ctx.textAlign='left';
      ctx.fillStyle='#c3cad6';ctx.font=fI(S/34,600);ctx.fillText(fitText(phone,pw-pad*2),x,by-S*0.02);}

/* style 1: the original recipe card (also what Free uses) */
function drawCardStyle(W,H,S,m,barH,title,price,phone,C){
  const PRO=isPro(),hasCard=!!(price||phone);let card=null;
  if(hasCard){
    const fs=Math.round(S/17),fs2=Math.round(S/24),pad=Math.round(fs*0.6);
    const cardW=W-m*2,cardH=pad*2+(title?fs*1.3:0)+(price?fs*1.55:0)+(phone?fs2*1.6:0);
    card={fs,fs2,pad,x:m,w:cardW,h:cardH,y:H-barH-m-cardH-Math.round(H*(H>W?0.1:0.04))};
  }
  if(logoOk()){
    const pos=$('logoPos').value,big=Math.round(S*(hasCard&&pos[0]==='b'?0.24:0.2));
    const ar=logoImg.naturalWidth/logoImg.naturalHeight;let lw=big,lh=Math.round(big/ar);if(lh>big*1.2){lh=Math.round(big*1.2);lw=Math.round(lh*ar);}
    let x=pos[1]==='l'?m:W-m-lw,y;
    if(pos[0]==='t')y=m+barH+(title&&!hasCard?Math.round(S*0.13):0);
    else if(card){y=card.y-Math.round(S*0.025)-lh;x=pos[1]==='l'?card.x+Math.round(card.pad*0.4):card.x+card.w-lw-Math.round(card.pad*0.4);}
    else y=H-m-barH-lh-Math.round(H*(H>W?0.1:0.04));
    ctx.drawImage(logoImg,x,y,lw,lh);
  }
  if(card){
    const {fs,fs2,pad,x,y,w:cardW}=card;
    ctx.save();shadowOn(S);
    let cy=y+pad;const lx=x+pad,maxW=cardW-pad*2;ctx.textAlign='left';
    if(title){ctx.font=fT(fs);ctx.fillStyle='#ffffff';ctx.fillText(fitText(capT(title),maxW),lx,cy+fs*0.95);cy+=fs*1.3;}
    if(price){const pf=Math.round(fs*0.9);ctx.font=fI(pf,800);const pt=fitText(price,maxW-pad),pw=ctx.measureText(pt).width+pad*1.2;
      ctx.fillStyle=C.c;rr(lx,cy+fs*0.05,pw,pf*1.35,pf*0.3);ctx.fill();ctx.save();ctx.shadowColor='transparent';ctx.fillStyle=C.ink;ctx.fillText(pt,lx+pad*0.6,cy+fs*0.05+pf*0.98);ctx.restore();cy+=fs*1.55;}
    if(phone){ctx.font=fI(fs2,800);ctx.fillStyle='#ffffff';ctx.fillText(fitText(t('orderVia',{p:phone}),maxW),lx,cy+fs2*1.05);}
    ctx.restore();
  }else if(title){
    const fs=Math.round(S/15);ctx.font=fT(fs);ctx.textAlign='center';
    const tt=fitText(capT(title),W-m*4),tw=ctx.measureText(tt).width,pad=fs*0.5,ty=Math.round(H*(look.bars?0.1:0.06));
    ctx.fillStyle=C.c;ctx.globalAlpha=0.95;rr(W/2-tw/2-pad,ty,tw+pad*2,fs*1.6,fs*0.35);ctx.fill();ctx.globalAlpha=1;
    ctx.fillStyle=C.ink;ctx.fillText(tt,W/2,ty+fs*1.15);ctx.textAlign='left';
  }
}

async function pollStats(){

      const dl=lost-(s._lost||0),dr=recv-(s._recv||0);s._lost=lost;s._recv=recv;
      const loss=dr+dl>0?dl/(dr+dl)*100:0;

/* logo: remove plain background (flood fill from the edges), trim, export PNG */
function processLogo(img,removeBg){
  const k=Math.min(1,600/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*k)),h=Math.max(1,Math.round(img.height*k));
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.drawImage(img,0,0,w,h);
  if(!removeBg)return c.toDataURL('image/png');
  const im=g.getImageData(0,0,w,h),d=im.data;
  const px=(x,y)=>(y*w+x)*4;
  // already transparent around the edge? keep as is
  const corners=[px(0,0),px(w-1,0),px(0,h-1),px(w-1,h-1)];
  if(corners.every(i=>d[i+3]<30))return trimLogo(c,g,im);
  // background colour = average of edge pixels that agree with the most common corner
  let br=0,bg=0,bb=0,n=0;
  const ref=corners.map(i=>[d[i],d[i+1],d[i+2]]).sort((A,B)=>(A[0]+A[1]+A[2])-(B[0]+B[1]+B[2]))[1];
  const dist=(i,col)=>Math.sqrt((d[i]-col[0])**2+(d[i+1]-col[1])**2+(d[i+2]-col[2])**2);
  for(let x=0;x<w;x++)for(const y of [0,h-1]){const i=px(x,y);if(dist(i,ref)<60){br+=d[i];bg+=d[i+1];bb+=d[i+2];n++;}}
  for(let y=0;y<h;y++)for(const x of [0,w-1]){const i=px(x,y);if(dist(i,ref)<60){br+=d[i];bg+=d[i+1];bb+=d[i+2];n++;}}
  if(n<(w+h)*0.5)return trimLogo(c,g,im); // edge is not a plain colour: leave the image untouched
  const col=[br/n,bg/n,bb/n],TOL=42,SOFT=70;
  const seen=new Uint8Array(w*h),stack=[];
  for(let x=0;x<w;x++){stack.push(x,0,x,h-1);}for(let y=0;y<h;y++){stack.push(0,y,w-1,y);}
  while(stack.length){
    const y=stack.pop(),x=stack.pop();if(x<0||y<0||x>=w||y>=h)continue;const j=y*w+x;if(seen[j])continue;seen[j]=1;
    const i=j*4,dd=dist(i,col);
    if(dd<TOL){d[i+3]=0;stack.push(x+1,y,x-1,y,x,y+1,x,y-1);}
    else if(dd<SOFT){d[i+3]=Math.min(d[i+3],Math.round((dd-TOL)/(SOFT-TOL)*255));}
  }
  g.putImageData(im,0,0);
  return trimLogo(c,g,g.getImageData(0,0,w,h));
}
function trimLogo(c,g,im){
  const w=c.width,h=c.height,d=im.data;let x0=w,y0=h,x1=-1,y1=-1;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(d[(y*w+x)*4+3]>16){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}}
  if(x1<0)return c.toDataURL('image/png');
  const p=2;x0=Math.max(0,x0-p);y0=Math.max(0,y0-p);x1=Math.min(w-1,x1+p);y1=Math.min(h-1,y1+p);
  const o=document.createElement('canvas');o.width=x1-x0+1;o.height=y1-y0+1;o.getContext('2d').drawImage(c,x0,y0,o.width,o.height,0,0,o.width,o.height);
  return o.toDataURL('image/png');
}

/* speech to text with the browser's own recogniser while the video plays out loud */
function seAuto(){
  if(se.rec){seAutoStop();return;}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast(t('seNoAuto'));return;}
  const v=$('seVid'),r=new SR();r.lang=$('seLang').value;r.continuous=true;r.interimResults=true;se.rec=r;let segStart=null;
  r.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){const res=e.results[i];if(segStart===null)segStart=Math.max(0,v.currentTime-0.6);
    if(res.isFinal){const txt=res[0].transcript.trim();const end=v.currentTime;if(txt)seAddSpeech(segStart,end,txt);segStart=null;}}};
  r.onend=()=>{if(se.rec===r&&!v.paused&&!v.ended){try{r.start();}catch(e){}}};
  r.onerror=ev=>{if(ev.error==='not-allowed'||ev.error==='service-not-allowed'){toast(t('seMicNeed'),4000);seAutoStop();}};
  try{r.start();}catch(e){toast(t('seNoAuto'));se.rec=null;return;}
  v.currentTime=0;v.muted=false;v.volume=1;v.play().catch(()=>{});$('seAutoBtn').textContent=t('seAutoStop');toast(t('seAutoRun'),4500);
}
function seAutoStop(){const r=se.rec;se.rec=null;if(r){try{r.stop();}catch(e){}}$('seAutoBtn').textContent=t('seAuto');}
function seAddSpeech(s0,e0,txt){
  const words=txt.split(/\s+/),per=8,parts=Math.ceil(words.length/per),dur=Math.max(0.8,e0-s0);
  for(let p=0;p<parts;p++){const w=words.slice(p*per,(p+1)*per).join(' ');const a=s0+dur*p/parts,b=s0+dur*(p+1)/parts;se.lines.push({s:+a.toFixed(2),e:+b.toFixed(2),txt:w});}
  seSave();seRenderList();
}
function seSrt(){
  if(!se.lines.length){toast(t('seEmpty'));return;}
  const ts=x=>{const h=Math.floor(x/3600),m=Math.floor(x%3600/60),s=Math.floor(x%60),ms=Math.round((x%1)*1000);const p=(n,l)=>String(n).padStart(l||2,'0');return `${p(h)}:${p(m)}:${p(s)},${p(ms,3)}`;};
  const txt=se.lines.filter(l=>l.txt.trim()).map((l,i)=>`${i+1}\n${ts(l.s)} --> ${ts(l.e)}\n${l.txt.trim()}\n`).join('\n');
  downloadBlob(new Blob([txt],{type:'text/plain'}),se.name.replace(/\.\w+$/,'')+'.srt');
}
function seDrawCap(c,W,H,txt){
  const f=OV_FONTS[$('seFont').value]||OV_FONTS.poppins,S=Math.min(W,H),fs=Math.round(S*Number($('seSize').value)/100);
  c.font=`${f.w} ${fs}px ${f.fam},"Bricolage Grotesque",sans-serif`;c.textAlign='center';txt=f.caps?txt.toUpperCase():txt;
  const maxW=W*0.88,lines=[];let cur='';txt.split(/\s+/).forEach(w=>{const tst=cur?cur+' '+w:w;if(c.measureText(tst).width>maxW&&cur){lines.push(cur);cur=w;}else cur=tst;});if(cur)lines.push(cur);
  const lh=fs*1.3,total=lines.length*lh,pos=$('sePos').value;let y=pos==='t'?H*0.08:pos==='m'?H/2-total/2:H*0.9-total;
  lines.forEach(l=>{const w=c.measureText(l).width;
    if($('seBox').checked){c.fillStyle='rgba(0,0,0,.62)';c.beginPath();if(c.roundRect)c.roundRect(W/2-w/2-fs*0.35,y,w+fs*0.7,lh,fs*0.25);else c.rect(W/2-w/2-fs*0.35,y,w+fs*0.7,lh);c.fill();}
    else{c.lineWidth=Math.max(2,fs*0.14);c.strokeStyle='rgba(0,0,0,.9)';c.lineJoin='round';c.strokeText(l,W/2,y+fs*1.0);}
    c.fillStyle=seColor();c.fillText(l,W/2,y+fs*1.0);y+=lh;});
}
/* make a new video: plays the recording once, drawing the lines and mixing the chosen sound. Takes as long as the video. */
async function seExport(){
  if(se.busy)return;if(!isPro()){openPro();return;}
  const aud=$('seAudio').value;if(!se.lines.some(l=>l.txt.trim())&&aud==='orig'){toast(t('seEmpty'));return;}
  seAutoStop();const pv=$('seVid');pv.pause();se.busy=true;$('seMake').disabled=true;
  try{
    const v=document.createElement('video');v.src=se.url;v.playsInline=true;v.preload='auto';
    await new Promise((res,rej)=>{v.onloadedmetadata=res;v.onerror=rej;});
    const long=Math.max(v.videoWidth,v.videoHeight),k=long>1920?1920/long:1,W=Math.round(v.videoWidth*k/2)*2,H=Math.round(v.videoHeight*k/2)*2;
    const cv=document.createElement('canvas');cv.width=W;cv.height=H;const c=cv.getContext('2d');
    ensureAudio();if(actx.state==='suspended')await actx.resume();
    const dest=actx.createMediaStreamDestination();
    if(aud==='orig'||aud==='mix'){const src=actx.createMediaElementSource(v);src.connect(dest);v.muted=false;}else v.muted=true;
    const useMusic=aud==='music'||aud==='mix';
    if(useMusic){const keep=$('musicSel').value;$('musicSel').value=$('seMusic').value;musicGain.connect(dest);startMusic(true);$('musicSel').value=keep;}
    const out=cv.captureStream(30);dest.stream.getAudioTracks().forEach(tr=>out.addTrack(tr));
    const mime=pickMime(),ext=mime.includes('mp4')?'mp4':'webm';
    const rec=new MediaRecorder(out,mime?{mimeType:mime,videoBitsPerSecond:W*H>=1900000?8000000:5000000,audioBitsPerSecond:128000}:{});
    const name=se.name.replace(/\.\w+$/,'')+'_'+t('seSuffix')+'.'+ext,sv=new Saver(name);
    rec.ondataavailable=e=>sv.push(e.data);
    const prog=$('seProg');prog.classList.add('show');
    let stop=false;const frame=()=>{if(stop)return;c.drawImage(v,0,0,W,H);const ct=v.currentTime;const l=se.lines.find(x=>ct>=x.s&&ct<x.e&&x.txt.trim());if(l)seDrawCap(c,W,H,l.txt.trim());
      const p=v.duration?ct/v.duration:0;$('seBar').style.width=Math.round(p*100)+'%';$('seProgTx').textContent=t('seMaking',{n:Math.round(p*100)});
      if(v.requestVideoFrameCallback)v.requestVideoFrameCallback(frame);else requestAnimationFrame(frame);};
    const done=new Promise(res=>{v.onended=res;});
    rec.start(2000);await v.play();frame();
    await done;stop=true;rec.stop();await new Promise(r=>rec.onstop=r);
    if(useMusic){stopMusic();try{musicGain.disconnect(dest);}catch(e){}previewGain.gain.value=0;}
    const r=await sv.finish(rec.mimeType||mime||'video/webm');
    $('seProgTx').textContent=t('seDone');$('seBar').style.width='100%';toast(t('saved',{w:r.where}),5000);listSaved('files');
  }catch(e){toast(t('seFail'),4000);}
  se.busy=false;$('seMake').disabled=false;
}

function armBack(){try{if(!history.state||!history.state.pmcGuard)history.pushState({pmcGuard:1},'');}catch(e){}}
function onBack(){
  if($('askBox').classList.contains('show')){askClose();return;}
  if($('studioHelp').classList.contains('show')){closeStudioHelp();return;}
  if($('subEd').classList.contains('show')){seClose();return;}
  const sh=[...document.querySelectorAll('.sheet-wrap.show')].pop();if(sh){closeSheet(sh.id);return;}
  for(const id of ['adminView','legalView','aboutView']){const v=$(id);if(v&&v.classList.contains('show')){v.classList.remove('show');return;}}
  if($('guide').classList.contains('show')){closeGuide();return;}
  const recOn=typeof recorder!=='undefined'&&recorder&&recorder.state!=='inactive';
  if($('master').classList.contains('show')){ask(t('bkDirT'),t(recOn?'bkRecD':'bkDirD'),t('bkLeave'),()=>{if(recOn){try{stopRec();}catch(e){}setTimeout(leave,isPro()&&$('optOutro').checked?4800:1500);}else leave();});return;}

function tpRecv(d){
  const box=$('tpBox'),inn=$('tpIn');
  if(d.cmd==='hide'){tpRun=false;box.classList.remove('show');return;}

}
function toggleLock(){if(!lockSupported()){toast(t('lockFail'));return;}setLock(!sLocked);}
function toggleGrid(){gridOn=!gridOn;$('gridBtn').classList.toggle('on',gridOn);$('gridOv').classList.toggle('show',gridOn);$('levelOv').classList.toggle('show',gridOn);}
function onTilt(e){
  if(e.gamma==null)return;
  const portrait=window.innerHeight>=window.innerWidth;let roll=portrait?e.gamma:e.beta;
  if(!portrait&&(screen.orientation&&screen.orientation.angle===270))roll=-roll;
  roll=Math.max(-45,Math.min(45,roll||0));
  const lv=$('levelOv');lv.style.transform=`translate(-50%,-50%) rotate(${-roll}deg)`;lv.classList.toggle('ok',Math.abs(roll)<2);
  $('levelTxt').textContent=Math.abs(roll)<2?'✓ '+t('level'):Math.round(Math.abs(roll))+'°';
}
function startTilt(){
  try{
    if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){DeviceOrientationEvent.requestPermission().then(r=>{if(r==='granted')window.addEventListener('deviceorientation',onTilt);}).catch(()=>{});}
    else window.addEventListener('deviceorientation',onTilt);
  }catch(e){}
}
let hdRec=null,hdId='',hdPart=0;
async function sendHD(id){
  const root=await recRoot();if(!root||!sConn)return;const list=[];
  for await(const [name,h] of root.entries()){if(h.kind==='directory'&&name.includes(id))list.push({name,h});}
  if(!list.length){sSend({t:'hdNone',id});return;}
  toast(t('angSend'),3000);
  for(const it of list){
    const blob=await savedBlob(it.h,mimeOf(it.name));const CH=64*1024;
    sSend({t:'hdBeg',id,name:it.name,size:blob.size,label:camLabel(),mime:blob.type});
    for(let o=0;o<blob.size;o+=CH){
      const dc=sConn&&sConn.dataChannel;while(dc&&dc.bufferedAmount>2*1024*1024)await new Promise(r=>setTimeout(r,40));
      if(!sConn||!sConn.open)return;sSend({t:'hdChunk',name:it.name,buf:await blob.slice(o,o+CH).arrayBuffer()});
    }
    sSend({t:'hdEnd',name:it.name});
  }
  toast(t('angSent'),3000);
}
let hdTitle='';
function hdStart(id,title){
  if(title)hdTitle=String(title).replace(/[^\p{L}\p{N}_-]+/gu,'_').replace(/^_+|_+$/g,'').slice(0,40);
  if(hdRec&&hdRec.state!=='inactive')return;
  if(id){hdId=id;hdPart=0;}
  const mime=pickMime(),ext=mime.includes('mp4')?'mp4':'webm';
  const lab=camLabel().replace(/[^\p{L}\p{N}_-]+/gu,'_');
  const sv=new Saver(`${hdTitle||'ProMultiCam'}_${hdId}_${lab}${hdPart?'_'+(hdPart+1):''}.${ext}`);hdPart++;
  try{hdRec=new MediaRecorder(sStream,mime?{mimeType:mime,videoBitsPerSecond:10000000,audioBitsPerSecond:128000}:{});}catch(e){return;}
  hdRec.ondataavailable=e=>sv.push(e.data);
  hdRec.onstop=async()=>{const r=await sv.finish(hdRec.mimeType||mime||'video/webm');toast(t('hdSaved',{w:r.where}),4000);};
  hdRec.start(3000);$('hdBadge').classList.add('show');
}
function hdStop(){if(hdRec&&hdRec.state!=='inactive')hdRec.stop();$('hdBadge').classList.remove('show');}
let battObj=null;
async function sendBattery(){
  try{
    if(!battObj&&navigator.getBattery){battObj=await navigator.getBattery();const f=()=>sendBattery();battObj.addEventListener('levelchange',f);battObj.addEventListener('chargingchange',f);}
    if(battObj)sSend({t:'stat',batt:Math.round(battObj.level*100),charging:!!battObj.charging});
  }catch(e){}
}
function sSend(o){try{if(sConn&&sConn.open)sConn.send(o);}catch(e){}}
function sStatus(ok,t){$('camDot').classList.toggle('ok',ok);$('camStatus').textContent=t;}
async function startSlaveCam(target,via){
  via=netVia()||via;
  stopScan();
  if(!sStream){try{sStream=await getCam();}catch(e){toast(t('allowCamMic'));return;}}
  sTarget=target;sVia=via;sKicked=false;
  show('slavecam');keepAwake();
  $('camVideo').srcObject=sStream;$('camAngleLbl').textContent=t('angleLine',{label:camLabel()});
  $('camVia').textContent=via==='data'?t('data'):'Wi-Fi';$('camVia').className='chip '+(via==='data'?'chip-gold':'chip-ok');
  camCaps();$('camZoom').oninput=e=>camZoom(e.target.value);
  $('gridOv').classList.toggle('show',gridOn);$('levelOv').classList.toggle('show',gridOn);startTilt();
  sConnect();
}
async function sConnect(){
  clearTimeout(sRetry);sStatus(false,t('connecting'));
  const p=await ensurePeer();
  sConn=p.connect(sTarget,{reliable:true});
  sConn.on('open',()=>{
    sConn.send({t:'hello',name:camLabel(),via:sVia});ecoWake();
    if(sTurnWatch)sTurnWatch();sTurnWatch=watchTurn(n=>{sTurn=n;sSend({t:'rot',v:n});fmtGuide(false);});sSend({t:'rot',v:sTurn});
    sCall=p.call(sTarget,sStream,{metadata:{name:camLabel(),via:sVia}});
    tuneSender();
    sCall.on('close',()=>sLost());
    sendBattery();
    sSend({t:'caps',...camCaps()});
  });
  sConn.on('data',d=>{
    if(!d||!d.t)return;
    if(d.t==='welcome')sStatus(true,t('connectedTo',{name:d.name||t('dir')}));
    else if(d.t==='live')$('onAir').classList.toggle('show',!!d.on);
    else if(d.t==='tp')tpRecv(d);
    else if(d.t==='getHD')sendHD(d.id);
    else if(d.t==='fmt'){sFmt=d.v==='l'?'l':'p';fmtGuide(true);}
    else if(d.t==='zoom')camZoom(d.v);
    else if(d.t==='lock')setLock(!!d.on);
    else if(d.t==='rec'){if(d.on)hdStart(d.id,d.title);else hdStop();}
    else if(d.t==='q'){const hi=!!d.hi;if(hi!==sHi){sHi=hi;tuneSender(true);}}
    else if(d.t==='pause'){try{hdRec&&hdRec.state==='recording'&&hdRec.pause();}catch(e){}}
    else if(d.t==='resume'){try{hdRec&&hdRec.state==='paused'&&hdRec.resume();}catch(e){}}
    else if(d.t==='full'){sKicked=true;toast(t('studioFull'),5000);setTimeout(leave,4000);}
    else if(d.t==='kick'){sKicked=true;toast(t('kicked'));setTimeout(leave,1500);}
  });
  sConn.on('close',()=>sLost());
  sConn.on('error',()=>sLost());
}
function sLost(){
  if(sKicked)return;
  $('onAir').classList.remove('show');sStatus(false,t('lost'));
  clearTimeout(sRetry);sRetry=setTimeout(sConnect,3000);
}

})();
