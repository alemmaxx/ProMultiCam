<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ProMultiCam</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.png" sizes="64x64">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0b0f17">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="i18n.js"></script>
<script type="module" src="account.js"></script>
<script src="https://unpkg.com/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{
  --bg:#0b0f17;--card:#131a26;--card2:#1a2232;--ink:#eef0f4;--muted:#98a2b3;--sub:#c3cad6;--line:#263044;
  --gold:#d9b44a;--gold2:#2e2712;--on-gold:#1b1503;
  --ok:#2fbf8c;--ok-soft:#123528;--bad:#ef6b5c;--bad-soft:#3a1c19;--info:#7aa7f5;--info-soft:#16233b;
  --soft:rgba(238,240,244,.07);--soft2:rgba(238,240,244,.1);
  --f:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--f);-webkit-font-smoothing:antialiased}
button,input,select{font-family:var(--f)}
button{cursor:pointer}
.screen{display:none;min-height:100%}
.screen.show{display:flex;flex-direction:column}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:8px;padding:11px 16px;font:700 14px var(--f);background:var(--soft2);color:var(--ink);min-height:44px;text-decoration:none}
.btn-gold{background:var(--gold);color:var(--on-gold);font-weight:800}
.btn-sm{min-height:34px;padding:6px 11px;font-size:13px}
.btn-soft{background:var(--gold2);color:var(--gold)}
.btn-danger{background:var(--bad-soft);color:var(--bad)}
.btn:disabled{opacity:.45}
.icon-btn{width:36px;height:36px;border:0;border-radius:10px;background:var(--soft);display:inline-grid;place-items:center;color:var(--ink);flex-shrink:0}
.input,select.input{width:100%;font:15px var(--f);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px 12px;min-height:46px;outline:none}
.input:focus{border-color:var(--gold)}
label.lbl{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700;white-space:nowrap}
.chip-ok{background:var(--ok-soft);color:var(--ok)}
.chip-gold{background:var(--gold2);color:var(--gold)}
.chip-info{background:var(--info-soft);color:var(--info)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--bad);display:inline-block}
.dot.ok{background:var(--ok)}
.topbar{display:flex;align-items:center;gap:10px;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));border-bottom:1px solid var(--line);background:var(--bg)}
.topbar .t{display:flex;flex-direction:column;flex:1;min-width:0}
.topbar .k{font-size:11px;font-weight:700;letter-spacing:.4px}
.topbar .n{font-size:17px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec{font-size:13px;font-weight:800}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000e;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:99;display:none;max-width:90%;text-align:center}

/* HOME */
.hero{padding:52px 22px 22px;padding-top:max(52px,calc(env(safe-area-inset-top) + 32px));background:radial-gradient(120% 80% at 85% 10%,#1c2f52 0%,transparent 60%),radial-gradient(90% 70% at 0% 100%,#2a2210 0%,transparent 60%),var(--bg);display:flex;flex-direction:column;gap:10px}
.logo{width:64px;height:64px;border-radius:16px;background:var(--card);display:grid;place-items:center}
.tag{font-size:13px;font-weight:700;color:var(--gold);letter-spacing:.4px}
.gold-h{margin:0;font-size:46px;font-weight:800;letter-spacing:-1.5px;line-height:1;background-image:linear-gradient(180deg,#fffbe9 0%,#f3dc8e 42%,#c99a2e 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p{margin:0;font-size:14px;color:var(--sub);line-height:1.5}
.home-body{padding:0 22px 26px;display:flex;flex-direction:column;gap:12px;flex:1}
.role{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;color:var(--ink);text-align:left;width:100%}
.role.master{border-color:var(--gold)}
.role .ic{width:50px;height:50px;flex-shrink:0;border-radius:12px;display:grid;place-items:center}
.role .tx{display:flex;flex-direction:column;gap:3px;flex:1}
.role .tx b{font-size:17px;font-weight:800}
.role .tx span{font-size:13px;color:var(--sub);line-height:1.4}
.conn-card{margin-top:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.conn-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.conn-grid div{background:var(--card2);border-radius:10px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:700;text-align:center}

/* MASTER */
#master{height:100%;max-height:100dvh}
.m-body{padding:10px 16px 0;display:flex;flex-direction:column;gap:10px;flex:1;overflow-y:auto}
.stage-box{position:relative;height:44vh;min-height:250px;border-radius:14px;overflow:hidden;background:#05080d;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
#stage{max-width:100%;max-height:100%;display:block}
.stage-box .tl{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap}
.stage-box .tl span{background:rgba(11,15,23,.85);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
.recbadge{position:absolute;top:10px;right:10px;background:var(--bad);color:#1a0705;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800;display:none}
.recbadge.show{display:block;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.55}}
.looks{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.looks::-webkit-scrollbar{display:none}
.looks button{flex:0 0 auto;min-height:36px;border-radius:999px;padding:6px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:700 13px var(--f);white-space:nowrap}
.looks button.on{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-height:38px;border:0;border-radius:8px;background:var(--soft2);color:var(--ink);font:700 13px var(--f)}
.seg button.on{background:var(--gold);color:var(--on-gold)}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{position:relative;height:104px;border-radius:12px;overflow:hidden;background:var(--card2);border:3px solid var(--line);padding:0}
.tile.main{border-color:var(--gold)}
.tile.sec2{border-color:var(--info)}
.tile video{width:100%;height:100%;object-fit:cover;display:block}
.tile .lb{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(11,15,23,.9));padding:14px 6px 5px;font-size:12px;font-weight:700;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .nb{position:absolute;top:4px;right:4px;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:800;color:var(--on-gold);background:var(--gold)}
.tile .nb.b{background:var(--info);color:#0b1a33}
.tile .stat{position:absolute;top:4px;left:4px;display:flex;gap:5px;align-items:center;background:rgba(11,15,23,.8);border-radius:6px;padding:2px 6px;font-size:10px;font-weight:700}
.bars{display:inline-flex;gap:1px;align-items:flex-end;height:10px}
.bars i{display:block;width:3px;border-radius:1px;background:#3b4558}
.bars i:nth-child(1){height:4px}.bars i:nth-child(2){height:7px}.bars i:nth-child(3){height:10px}
.tile-empty{grid-column:1/-1;background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:16px;font-size:13px;color:var(--sub);line-height:1.5;text-align:center}
.hint{font-size:12px;color:var(--muted)}
.m-foot{padding:10px 16px 18px;padding-bottom:max(18px,env(safe-area-inset-bottom));display:flex;gap:8px}
.m-foot .side{width:56px;min-height:56px;border:0;border-radius:12px;background:var(--soft2);color:var(--ink);display:none;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:700 10px var(--f)}
.m-foot.rec .side{display:flex}
#recBtn{flex:1}
.countdown{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,8,13,.55);font-size:96px;font-weight:800;color:var(--gold)}
.countdown.show{display:flex}
.recbadge.paused{background:var(--gold);color:var(--on-gold);animation:none}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink);line-height:1.4}
.check input{width:20px;height:20px;accent-color:var(--gold);flex-shrink:0;margin-top:1px}
#liveFeed{position:fixed;inset:0;background:#000;z-index:80;display:none;align-items:center;justify-content:center}
#liveFeed.show{display:flex}
#liveFeed canvas{max-width:100vw;max-height:100vh}
#liveHint{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(11,15,23,.85);color:#eef0f4;border-radius:12px;padding:10px 14px;font-size:13px;text-align:center;max-width:90%;transition:opacity .6s}
.hdbadge{display:none;align-self:flex-start;background:var(--bad);color:#1a0705;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:800}
.hdbadge.show{display:block}
#recBtn{width:100%;min-height:56px;border:0;border-radius:12px;background:var(--gold);color:var(--on-gold);font:800 17px var(--f);letter-spacing:.3px}
#recBtn.recording{background:var(--bad);color:#1a0705}
.sheet-wrap{position:fixed;inset:0;background:rgba(5,8,13,.72);display:none;flex-direction:column;justify-content:flex-end;z-index:50}
.sheet-wrap.show{display:flex}
.sheet{background:var(--card);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:18px 16px;padding-bottom:max(24px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;max-height:85vh;overflow-y:auto}
.sheet h3{margin:0;font-size:17px;font-weight:800}
.item{display:flex;align-items:center;gap:10px;background:var(--card2);border-radius:12px;padding:12px}
.item .tx{display:flex;flex-direction:column;flex:1;min-width:0}
.item .tx b{font-size:15px}
.item .tx span{font-size:12px;color:var(--muted)}
.codebox{background:var(--gold2);border:1px solid var(--gold);border-radius:12px;padding:12px;display:flex;justify-content:space-between;align-items:center}
.codebox big{font-size:26px;font-weight:800;letter-spacing:4px;color:var(--gold)}
.files a{color:var(--gold);font-size:14px;word-break:break-all}

/* SLAVE CONNECT */
.s-body{padding:16px;display:flex;flex-direction:column;gap:14px;flex:1}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{min-height:42px;border:0;border-radius:9px;background:transparent;color:var(--ink);font:700 13px var(--f)}
.tabs button.on{background:var(--gold);color:var(--on-gold)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.master-item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--gold);border-radius:14px;padding:14px;color:var(--ink);width:100%;text-align:left}
.master-item .ic{width:44px;height:44px;border-radius:12px;background:var(--gold2);display:grid;place-items:center;flex-shrink:0}
.master-item .tx{display:flex;flex-direction:column;flex:1;gap:2px}
.master-item .tx b{font-size:16px;font-weight:800}
.master-item .tx span{font-size:12px;color:var(--muted)}
.master-item .go{background:var(--gold);color:var(--on-gold);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:800}
.scan{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* SLAVE CAM */
#slavecam{position:fixed;inset:0;background:#000}
#camVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam-top{position:absolute;top:0;left:0;right:0;padding:16px 16px 40px;padding-top:max(16px,env(safe-area-inset-top));display:flex;flex-direction:column;gap:8px;background:linear-gradient(rgba(11,15,23,.92),rgba(11,15,23,0))}
.cam-top .st{display:inline-flex;align-items:center;gap:6px;background:rgba(11,15,23,.85);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.onair{align-self:flex-start;background:var(--gold);color:var(--on-gold);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:800;display:none}
.onair.show{display:block}
.cam-bot{position:absolute;left:0;right:0;bottom:0;padding:40px 16px 24px;padding-bottom:max(24px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;background:linear-gradient(rgba(11,15,23,0),rgba(11,15,23,.95) 35%)}
.cam-bot .g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cam-bot .g3 .btn{background:rgba(238,240,244,.12);font-size:13px;padding:8px}
input[type=range]{accent-color:var(--gold);width:100%}

/* Director: full-phone main view */
#master.show{position:fixed;inset:0;background:#000}
.stage-full{position:absolute;inset:0;overflow:hidden;background:#000}
.stage-full #stage{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.ov-top{position:absolute;top:0;left:0;right:0;padding:10px 12px 26px;padding-top:max(10px,env(safe-area-inset-top));display:flex;gap:8px;align-items:center;background:linear-gradient(rgba(11,15,23,.88),rgba(11,15,23,0));z-index:3}
.ov-top .icon-btn{background:rgba(11,15,23,.55);width:40px;height:40px}
.ov-tags{position:absolute;left:12px;top:calc(max(10px,env(safe-area-inset-top)) + 54px);display:flex;gap:6px;flex-wrap:wrap;z-index:3}
.ov-tags span{background:rgba(11,15,23,.8);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
.ov-tags span:empty{display:none}
#master .recbadge{top:calc(max(10px,env(safe-area-inset-top)) + 54px);right:12px;z-index:3}
.zoomv{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:44px;height:200px;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:3}
.zoomv span{font-size:11px;font-weight:800;color:var(--gold);background:rgba(11,15,23,.75);border-radius:8px;padding:2px 5px}
.zoomv input{width:170px;transform:rotate(-90deg) translateX(-80px);transform-origin:center;margin-top:70px}
.ov-bot{position:absolute;left:0;right:0;bottom:0;padding-top:28px;background:linear-gradient(rgba(11,15,23,0),rgba(11,15,23,.92) 38%);z-index:3}
#tileHint{display:block;padding:0 12px 6px;font-size:11px;color:var(--sub)}
.strip{display:flex;gap:8px;overflow-x:auto;padding:0 12px 8px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip .tile{flex:0 0 66px;height:88px;border-width:2px;border-radius:10px}
.strip .tile .lb{font-size:10px;padding:12px 4px 3px}
.strip .tile .nb{font-size:9px;padding:0 4px;top:auto;bottom:22px;right:3px}
.strip .tile .stat{font-size:9px;top:2px;left:2px;padding:1px 4px;gap:3px}
.strip .tile-empty{flex:1;font-size:12px;padding:10px;background:rgba(19,26,38,.8)}
.tile-add{flex:0 0 66px;height:88px;border:2px dashed var(--line);border-radius:10px;background:rgba(19,26,38,.7);color:var(--gold);font:800 26px var(--f)}
#master .m-foot{padding:4px 12px 14px;padding-bottom:max(14px,env(safe-area-inset-bottom))}
#master #recBtn{min-height:54px}

.qrwrap{display:flex;gap:12px;align-items:center;background:#fff;border-radius:12px;padding:10px;color:#1b1503}
#qrBox{width:128px;height:128px;flex-shrink:0}#qrBox svg{width:100%;height:100%}
.qrwrap .tx{display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:600;line-height:1.4}
.guide{position:fixed;inset:0;z-index:95;background:rgba(5,8,13,.85);display:none;align-items:center;justify-content:center;padding:20px}
.guide.show{display:flex}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:12px}
.gcard b{font-size:20px;font-weight:800}
.gcard p{margin:0;font-size:14px;color:var(--sub);line-height:1.55}
#gArt{background:var(--card2);border-radius:14px;height:170px;display:flex;align-items:center;justify-content:center}
.gdots{display:flex;gap:6px;justify-content:center}.gdots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.gdots i.on{background:var(--gold);width:22px;border-radius:4px}
.subsec{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.logo-prev{width:52px;height:52px;border-radius:10px;background:var(--card2) center/contain no-repeat;border:1px solid var(--line);flex-shrink:0}

.vu{display:inline-flex;gap:2px;align-items:flex-end;height:14px;margin-left:6px;vertical-align:middle}
.vu i{width:3px;border-radius:1px;background:#3b4558;height:4px;transition:height .08s}
.grid3x3{position:absolute;inset:0;pointer-events:none;display:none;background-image:linear-gradient(to right,transparent calc(33.33% - 1px),rgba(255,255,255,.35) calc(33.33% - 1px),rgba(255,255,255,.35) 33.33%,transparent 33.33%,transparent calc(66.66% - 1px),rgba(255,255,255,.35) calc(66.66% - 1px),rgba(255,255,255,.35) 66.66%,transparent 66.66%),linear-gradient(to bottom,transparent calc(33.33% - 1px),rgba(255,255,255,.35) calc(33.33% - 1px),rgba(255,255,255,.35) 33.33%,transparent 33.33%,transparent calc(66.66% - 1px),rgba(255,255,255,.35) calc(66.66% - 1px),rgba(255,255,255,.35) 66.66%,transparent 66.66%)}
.grid3x3.show{display:block}
.level{position:absolute;left:50%;top:50%;width:120px;height:0;border-top:3px solid #ef6b5c;transform:translate(-50%,-50%);pointer-events:none;display:none}
.level.show{display:block}.level.ok{border-color:#2fbf8c}
.level span{position:absolute;left:50%;top:6px;transform:translateX(-50%);font-size:12px;font-weight:800;background:rgba(11,15,23,.8);border-radius:6px;padding:1px 6px;white-space:nowrap}
.cam-tools{display:flex;gap:8px;flex-wrap:wrap}
.cam-tools .btn{background:rgba(238,240,244,.12);min-height:38px;padding:6px 12px;font-size:13px}
.cam-tools .btn.on{background:var(--gold);color:var(--on-gold)}
.test-row{display:flex;gap:10px;align-items:flex-start;background:var(--card2);border-radius:12px;padding:12px}
.test-row .ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;flex-shrink:0}
.test-row .tx{display:flex;flex-direction:column;gap:2px;font-size:13px}
.test-row .tx b{font-size:14px}.test-row .tx span{color:var(--sub)}

.acct-btn{display:inline-flex;align-items:center;gap:6px;min-height:38px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 10px;font:700 13px var(--f)}
.badge{display:inline-block;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:800}
.b-pro{background:var(--gold);color:var(--on-gold)}.b-trial{background:var(--info-soft);color:var(--info)}.b-free{background:var(--soft2);color:var(--sub)}
.tabs2{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--card2);border-radius:10px;padding:4px}
.tabs2 button{min-height:40px;border:0;border-radius:8px;background:transparent;color:var(--ink);font:700 14px var(--f)}
.tabs2 button.on{background:var(--gold);color:var(--on-gold)}
.gbtn{background:#fff;color:#1f1f1f}
.plan-card{border:2px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px;background:var(--card2);text-align:left;color:var(--ink);font-family:var(--f);cursor:pointer}
.plan-card.on{border-color:var(--gold)}
.plan-card b{font-size:16px}.plan-card .pr{font-size:24px;font-weight:800}
.feat-list{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--sub)}
.feat-list span::before{content:"✓  ";color:var(--gold);font-weight:800}
.locked{position:relative}
.locked>*:not(.lockbar){opacity:.4;pointer-events:none}
.lockbar{display:none}
.locked .lockbar{display:flex;align-items:center;gap:8px;justify-content:space-between;background:var(--gold2);border-radius:10px;padding:8px 10px;font-size:13px;font-weight:700;color:var(--gold)}

#adminView{position:fixed;inset:0;z-index:90;background:var(--bg);display:none;flex-direction:column}
#adminView.show{display:flex}
#adminView iframe{flex:1;border:0;width:100%;background:var(--bg)}
.b-admin{background:#7aa7f5;color:#0b1a33}
</style>
</head>
<body>

<!-- ================= HOME ================= -->
<div id="home" class="screen show">
  <div class="hero">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div class="logo"><svg width="44" height="44" viewBox="0 0 100 100" fill="none" aria-hidden="true"><rect x="16" y="22" width="46" height="34" rx="7" stroke="#7aa7f5" stroke-width="5"/><rect x="27" y="33" width="46" height="34" rx="7" stroke="#c3cad6" stroke-width="5" fill="#131a26"/><rect x="38" y="44" width="46" height="34" rx="7" fill="#d9b44a"/><circle cx="61" cy="61" r="7" fill="#1b1503"/><circle cx="61" cy="61" r="3" fill="#ef6b5c"/></svg></div><div style="display:flex;gap:6px;align-items:center"><select id="langSel" class="input" aria-label="Language" style="width:auto;max-width:130px;min-height:38px;padding:6px 10px;font-size:13px;background:var(--card)"></select><button class="acct-btn" id="acctBtn" onclick="openAccount()"></button></div></div>
    <span class="tag" data-i18n="tag"></span>
    <h1 class="gold-h">ProMultiCam</h1>
    <p data-i18n="hero"></p>
    <button class="btn btn-gold" id="installBtn" style="display:none;align-self:flex-start;margin-top:4px" onclick="doInstall()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span data-i18n="install"></span></button>
    <span class="hint" id="iosHint" style="display:none" data-i18n="installIos"></span>
  </div>
  <div class="home-body">
    <label class="lbl"><span data-i18n="devName"></span><input class="input" id="devName" maxlength="24" data-i18n-ph="devNamePh"></label>
    <span class="sec muted" style="margin-top:4px" data-i18n="pickRole"></span>
    <button class="role master" onclick="goMaster()">
      <div class="ic" style="background:var(--gold)"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1b1503" stroke-width="2.2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4" fill="#1b1503"/></svg></div>
      <div class="tx"><b style="color:var(--gold)" data-i18n="dir"></b><span data-i18n="dirDesc"></span></div>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#98a2b3" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <button class="role" onclick="goSlave()">
      <div class="ic" style="background:var(--info-soft)"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#7aa7f5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8a2 2 0 0 1 2-2h2l2-2h6l2 2h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="4"/></svg></div>
      <div class="tx"><b style="color:var(--info)" data-i18n="cam"></b><span data-i18n="camDesc"></span></div>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#98a2b3" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <button class="btn btn-sm btn-gold" id="adminBtn" style="align-self:flex-start;display:none" onclick="openAdmin()">⚙ Admin</button>
    <button class="btn btn-sm" style="align-self:flex-start" onclick="runTest()">🩺 <span data-i18n="testBtn"></span></button>
    <button class="btn btn-sm" style="align-self:flex-start" onclick="openGuide()">📘 <span data-i18n="guide"></span></button>
    <a class="btn btn-sm" style="align-self:flex-start" href="landing.html" data-i18n="about"></a>
    <div class="conn-card">
      <span class="sec" data-i18n="connWays"></span>
      <div class="conn-grid">
        <div><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2fbf8c" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1" fill="#2fbf8c"/></svg>Wi-Fi</div>
        <div><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7aa7f5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7l10 10-5 5V2l5 5L7 17"/></svg>Bluetooth</div>
        <div><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d9b44a" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 20v-4M10 20v-8M15 20v-12M20 20V4"/></svg><span data-i18n="mobile"></span></div>
      </div>
    </div>
    <span class="hint" style="text-align:center;margin-top:4px">ProMultiCam v1.0</span>
  </div>
</div>

<!-- ================= MASTER (Director) ================= -->
<div id="master" class="screen">
  <div class="stage-full" id="stageFull">
    <canvas id="stage" width="720" height="1280"></canvas>
    <div class="countdown" id="countdown"></div>
    <div class="ov-top">
      <button class="icon-btn" aria-label="Back" onclick="leave()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
      <div class="t" style="display:flex;flex-direction:column;min-width:0;flex:1"><span class="n" id="mName" style="font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Studio</span><span style="display:flex;align-items:center"><span id="camCount" style="font-size:11px;font-weight:700;color:var(--ok)"></span><span class="vu" id="vu" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span></span></div>
      <button class="icon-btn" aria-label="Recordings" onclick="openSheet('filesSheet')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9l5 3-5 3z"/></svg></button>
      <button class="icon-btn" aria-label="Style" onclick="openSheet('styleSheet')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="8.5" cy="10" r="1.3"/><circle cx="12" cy="7.5" r="1.3"/><circle cx="15.5" cy="10" r="1.3"/><path d="M12 21a2.5 2.5 0 0 1 0-5h1.5a2.5 2.5 0 0 0 2.5-2.5"/></svg></button>
      <button class="icon-btn" aria-label="Settings" onclick="openSheet('setSheet')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
    </div>
    <div class="ov-tags"><span id="lblAngle" style="color:var(--gold)"></span><span id="lblLook"></span></div>
    <div class="recbadge" id="recBadge"><span id="recLbl">● REC</span> <span id="recTime">00:00</span></div>
    <div class="zoomv"><span id="zoomVal">1.0×</span><input type="range" id="zoom" min="1" max="4" step="0.1" value="1" aria-label="Zoom"></div>
    <div class="ov-bot">
      <span id="tileHint"></span>
      <div class="strip" id="tiles"></div>
      <div class="m-foot" id="mFoot">
        <button class="side" id="pauseBtn" onclick="togglePause()"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg><span id="pauseLbl" data-i18n="pause"></span></button>
        <button id="recBtn" onclick="toggleRec()"></button>
        <button class="side" onclick="addMark()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg><span data-i18n="mark"></span></button>
      </div>
    </div>
  </div>
  <div id="liveFeed" onclick="liveTap(event)"><div id="liveHint" data-i18n="liveHint"></div></div>
</div>

<!-- master: style sheet -->
<div class="sheet-wrap" id="styleSheet" onclick="if(event.target===this)closeSheet(this.id)">
  <div class="sheet">
    <div class="row-between"><h3 data-i18n="looks"></h3><button class="icon-btn" aria-label="Close" onclick="closeSheet('styleSheet')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="looks" id="looks" style="flex-wrap:wrap"></div>
    <span class="sec" data-i18n="layout"></span>
    <div class="seg" id="modeSeg">
      <button data-m="full" class="on" data-i18n="mFull"></button>
      <button data-m="split" data-i18n="mSplit"></button>
      <button data-m="pip" data-i18n="mPip"></button>
    </div>
  </div>
</div>

<!-- master: recordings sheet -->
<div class="sheet-wrap" id="filesSheet" onclick="if(event.target===this)closeSheet(this.id)">
  <div class="sheet">
    <div class="row-between"><h3 data-i18n="savedRecs"></h3><button class="icon-btn" aria-label="Close" onclick="closeSheet('filesSheet')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="files" id="files" style="display:flex;flex-direction:column;gap:6px"></div>
  </div>
</div>

<!-- master: connections sheet -->
<div class="sheet-wrap" id="connSheet" onclick="if(event.target===this)closeSheet(this.id)">
  <div class="sheet">
    <div class="row-between"><h3 data-i18n="liveCams"></h3><button class="icon-btn" aria-label="Tutup" onclick="closeSheet('connSheet')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="qrwrap"><div id="qrBox"></div><div class="tx"><span data-i18n="scanQR"></span><button class="btn btn-sm btn-gold" onclick="shareJoin()" data-i18n="shareLink"></button></div></div>
    <div class="codebox"><div><div class="hint" data-i18n="code"></div><big id="roomCode">------</big></div></div>
    <div id="connList" style="display:flex;flex-direction:column;gap:8px"></div>
    <button class="btn" id="localBtn" onclick="addLocalCam()" data-i18n="useLocal"></button>
    <span class="hint" style="line-height:1.5" data-i18n="connHint"></span>
  </div>
</div>

<!-- master: settings sheet -->
<div class="sheet-wrap" id="setSheet" onclick="if(event.target===this)closeSheet(this.id)">
  <div class="sheet">
    <div class="row-between"><h3 data-i18n="settings"></h3><button class="icon-btn" aria-label="Tutup" onclick="closeSheet('setSheet')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <label class="lbl"><span data-i18n="format"></span><select class="input" id="aspectSel"><option value="p" data-i18n="fmtP"></option><option value="l" data-i18n="fmtL"></option></select></label>
    <label class="lbl"><span data-i18n="quality"></span><select class="input" id="qualSel"><option value="720" data-i18n="q720"></option><option value="1080" data-i18n="q1080"></option></select></label>
    <label class="lbl"><span data-i18n="audio"></span><select class="input" id="audioSel"><option value="none">-</option></select></label>
    <label class="lbl"><span data-i18n="title"></span><input class="input" id="titleTxt" maxlength="40" data-i18n-ph="titlePh"></label>
    <div class="subsec">
      <span class="sec" data-i18n="autoSw"></span>
      <select class="input" id="autoSel"><option value="0" data-i18n="autoOff"></option><option value="5"></option><option value="10"></option><option value="15"></option><option value="30"></option></select>
    </div>
    <div class="subsec pro-only">
      <div class="lockbar"><span>🔒 <span data-i18n="proOnly"></span></span><button class="btn btn-sm btn-gold" onclick="openPro()" data-i18n="upgrade"></button></div>
      <span class="sec" data-i18n="brand"></span>
      <div style="display:flex;gap:10px;align-items:center">
        <div class="logo-prev" id="logoPrev"></div>
        <label class="btn btn-sm btn-soft" style="cursor:pointer"><span data-i18n="logoAdd"></span><input type="file" id="logoFile" accept="image/*" style="display:none"></label>
        <button class="btn btn-sm btn-danger" id="logoDel" data-i18n="logoRemove"></button>
      </div>
      <label class="lbl"><span data-i18n="logoPos"></span><select class="input" id="logoPos"><option value="tr" data-i18n="posTR"></option><option value="tl" data-i18n="posTL"></option><option value="br" data-i18n="posBR"></option><option value="bl" data-i18n="posBL"></option></select></label>
      <label class="lbl"><span data-i18n="price"></span><input class="input" id="priceTxt" maxlength="20" data-i18n-ph="pricePh"></label>
      <label class="lbl"><span data-i18n="phone"></span><input class="input" id="phoneTxt" maxlength="24" inputmode="tel" data-i18n-ph="phonePh"></label>
    </div>
    <div class="subsec pro-only">
      <div class="lockbar"><span>🔒 <span data-i18n="proOnly"></span></span><button class="btn btn-sm btn-gold" onclick="openPro()" data-i18n="upgrade"></button></div>
      <span class="sec" data-i18n="music"></span>
      <select class="input" id="musicSel"><option value="none" data-i18n="mNone"></option><option value="lofi" data-i18n="mLofi"></option><option value="ceria" data-i18n="mCeria"></option><option value="custom" data-i18n="mCustom"></option></select>
      <label class="btn btn-sm btn-soft" id="musicFileBtn" style="display:none;cursor:pointer;align-self:flex-start"><span data-i18n="mFile"></span><input type="file" id="musicFile" accept="audio/*" style="display:none"></label>
      <div style="display:flex;gap:10px;align-items:center"><span class="hint" data-i18n="mVol"></span><input type="range" id="musicVol" min="0" max="100" value="35" style="flex:1"><button class="btn btn-sm" id="musicPrev" onclick="togglePreview()" data-i18n="mPreview"></button></div>
      <span class="hint" style="line-height:1.5" data-i18n="musicNote"></span>
    </div>
    <div class="subsec" style="border-top:1px solid var(--line);padding-top:12px"></div>
    <label class="check"><input type="checkbox" id="optFade" checked><span data-i18n="fadeOpt"></span></label>
    <label class="check"><input type="checkbox" id="optNoise" checked><span data-i18n="noiseOpt"></span></label>
    <label class="check"><input type="checkbox" id="optCount" checked><span data-i18n="countdownOpt"></span></label>
    <div class="pro-only" style="display:flex;flex-direction:column;gap:6px"><div class="lockbar"><span>🔒 <span data-i18n="proOnly"></span></span><button class="btn btn-sm btn-gold" onclick="openPro()" data-i18n="upgrade"></button></div><label class="check"><input type="checkbox" id="optHD"><span data-i18n="hdOpt"></span></label></div>
    <div class="panel" style="gap:8px;padding:12px">
      <b style="font-size:15px" data-i18n="liveMode"></b>
      <span class="hint" style="line-height:1.5" data-i18n="liveHelp"></span>
      <button class="btn btn-gold" onclick="enterLive()" data-i18n="liveGo"></button>
    </div>
  </div>
</div>

<!-- ================= SLAVE CONNECT ================= -->
<div id="slave" class="screen">
  <div class="topbar">
    <button class="icon-btn" aria-label="Kembali" onclick="leave()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
    <div class="t"><span class="k" style="color:var(--info)" data-i18n="cam"></span><span class="n" data-i18n="connectTo"></span></div>
  </div>
  <div class="s-body">
    <div style="display:flex;flex-direction:column;gap:6px">
      <span class="sec muted" data-i18n="method"></span>
      <div class="tabs" id="tabs">
        <button data-t="wifi" class="on">Wi-Fi</button>
        <button data-t="bt">Bluetooth</button>
        <button data-t="data" data-i18n="data"></button>
      </div>
    </div>

    <div id="tab-wifi" style="display:flex;flex-direction:column;gap:10px">
      <div class="scan" id="scanMsg"></div>
      <div id="masterList" style="display:flex;flex-direction:column;gap:8px"></div>
      <button class="btn btn-sm" onclick="scanMasters()" style="align-self:flex-start" data-i18n="rescan"></button>
      <span class="hint" style="line-height:1.5" data-i18n="noRouter"></span>
    </div>

    <div id="tab-bt" class="panel" style="display:none;align-items:center;text-align:center">
      <div style="width:64px;height:64px;border-radius:50%;background:var(--info-soft);display:grid;place-items:center"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#7aa7f5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7l10 10-5 5V2l5 5L7 17"/></svg></div>
      <b style="font-size:16px" data-i18n="btTitle"></b>
      <span class="chip chip-gold" data-i18n="soon"></span>
      <span style="font-size:13px;color:var(--sub);line-height:1.5" data-i18n="btDesc"></span>
    </div>

    <div id="tab-data" class="panel" style="display:none">
      <b style="font-size:16px" data-i18n="dataTitle"></b>
      <span style="font-size:13px;color:var(--sub);line-height:1.5" data-i18n="dataDesc"></span>
      <div style="display:flex;gap:8px">
        <input class="input" id="joinCode" inputmode="numeric" maxlength="6" data-i18n-ph="codePh" style="flex:1;min-width:0">
        <button class="btn btn-gold" onclick="joinByCode()" data-i18n="join"></button>
      </div>
    </div>

    <div style="margin-top:auto;display:flex;flex-direction:column;gap:6px">
      <label class="lbl"><span data-i18n="label"></span><input class="input" id="camLabel" maxlength="20" data-i18n-ph="labelPh"></label>
      <span class="hint" data-i18n="labelHint"></span>
      <div class="files" id="sfiles" style="display:none;flex-direction:column;gap:6px;margin-top:8px"></div>
    </div>
  </div>
</div>

<!-- ================= SLAVE CAMERA ================= -->
<div id="slavecam" class="screen">
  <video id="camVideo" autoplay playsinline muted></video>
  <div class="grid3x3" id="gridOv"></div>
  <div class="level" id="levelOv"><span id="levelTxt"></span></div>
  <div class="cam-top">
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <span class="st"><span class="dot" id="camDot"></span><span id="camStatus"></span></span>
      <span class="chip chip-ok" id="camVia">Wi-Fi</span>
    </div>
    <span class="onair" id="onAir" data-i18n="onAir"></span>
    <span class="hdbadge" id="hdBadge" data-i18n="hdOn"></span>
  </div>
  <div class="cam-bot">
    <div id="zoomRow" style="display:none;align-items:center;gap:10px">
      <span style="font-size:13px;font-weight:700;color:var(--sub)" data-i18n="zoom"></span>
      <input type="range" id="camZoom" min="1" max="5" step="0.1" value="1" style="flex:1">
      <span id="camZoomVal" style="font-size:13px;font-weight:700;color:var(--gold);min-width:36px">1.0×</span>
    </div>
    <div class="cam-tools">
      <button class="btn on" id="gridBtn" onclick="toggleGrid()" data-i18n="gridLbl"></button>
      <button class="btn" id="lockBtn" onclick="toggleLock()" data-i18n="lockLbl"></button>
    </div>
    <div class="g3">
      <button class="btn" onclick="camFlip()" data-i18n="flip"></button>
      <button class="btn" id="torchBtn" onclick="camTorch()" data-i18n="torch"></button>
      <button class="btn btn-danger" onclick="leave()" data-i18n="disconnect"></button>
    </div>
    <span class="hint" style="text-align:center;line-height:1.5"><span id="camAngleLbl"></span><br><span data-i18n="savedLine"></span></span>
  </div>
</div>

<div class="sheet-wrap" id="testSheet" onclick="if(event.target===this)closeSheet(this.id)">
  <div class="sheet">
    <div class="row-between"><h3 data-i18n="testT"></h3><button class="icon-btn" aria-label="Close" onclick="closeSheet('testSheet')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div id="testList" style="display:flex;flex-direction:column;gap:8px"></div>
  </div>

/* same Wi-Fi = same public IP -> shared LAN room key */
async function lanKey(){
  try{
    const r=await fetch('https://api.ipify.org?format=json',{cache:'no-store'});const j=await r.json();
    const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('pmc|'+j.ip));
    return [...new Uint8Array(buf)].slice(0,6).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){return null;}
}

/* ---------- crash-safe recording storage (OPFS: each chunk is its own file on disk) ---------- */
async function recRoot(){try{const r=await navigator.storage.getDirectory();return await r.getDirectoryHandle('recordings',{create:true});}catch(e){return null;}}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
class Saver{
  constructor(name){this.name=name;this.mem=[];this.n=0;this.q=Promise.resolve();this.ready=this.init();}
  async init(){
    try{const root=await recRoot();if(!root)return;this.dir=await root.getDirectoryHandle(this.name,{create:true});
      const fh=await this.dir.getFileHandle('_test',{create:true});const w=await fh.createWritable();await w.close();await this.dir.removeEntry('_test');}
    catch(e){this.dir=null;}
  }
  push(blob){
    if(!blob||!blob.size)return;
    this.q=this.q.then(async()=>{
      await this.ready;
      if(this.dir){try{const fh=await this.dir.getFileHandle(String(++this.n).padStart(6,'0'),{create:true});const w=await fh.createWritable();await w.write(blob);await w.close();return;}catch(e){}}
      this.mem.push(blob);
    });
  }
  async finish(type){
    await this.q;
    if(this.dir){try{await (await this.dir.getFileHandle('_done',{create:true})).createWritable().then(w=>w.close());}catch(e){}}
    const blob=this.dir?new Blob([await savedBlob(this.dir,type),...this.mem],{type}):new Blob(this.mem,{type});
    downloadBlob(blob,this.name);
    return{blob,where:'Downloads/'+this.name};
  }
}
async function savedBlob(dir,type){
  const parts=[];for await(const [k,h] of dir.entries()){if(k[0]!=='_'&&h.kind==='file')parts.push([k,await h.getFile()]);}
  parts.sort((a,b)=>a[0]<b[0]?-1:1);
  return new Blob(parts.map(p=>p[1]),{type});
}
function downloadBlob(blob,name){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);}
function mimeOf(name){return name.endsWith('.mp4')?'video/mp4':'video/webm';}
async function listSaved(boxId){
  const box=$(boxId||($('slave').classList.contains('show')?'sfiles':'files'));if(!box)return;
  const root=await recRoot();if(!root){return;}
  const items=[];
  for await(const [name,h] of root.entries()){
    if(h.kind!=='directory')continue;
    let size=0,done=false,count=0;
    let marks=null;
    for await(const [k,f] of h.entries()){if(k==='_done')done=true;else if(k==='_markers.txt'){try{marks=await (await f.getFile()).text();}catch(e){}}else if(f.kind==='file'&&k[0]!=='_'){count++;try{size+=(await f.getFile()).size;}catch(e){}}}
    if(!count){try{await root.removeEntry(name,{recursive:true});}catch(e){}continue;}
    items.push({name,h,size,done,marks});
  }
  items.sort((a,b)=>a.name<b.name?1:-1);
  box.innerHTML='';box.style.display=items.length?'flex':'none';
  if(!items.length)return;
  const hd=document.createElement('span');hd.className='sec';hd.textContent=t('savedRecs');box.appendChild(hd);
  items.forEach(it=>{
    const d=document.createElement('div');d.className='item';
    d.innerHTML='<span class="dot ok"></span><div class="tx"><b></b><span></span></div>';
    d.querySelector('b').textContent=it.name.replace(/^ProMultiCam_/,'');
    const mc=it.marks?it.marks.trim().split('\n').filter(Boolean).length-1:0;
    d.querySelector('.tx span').textContent=(it.size/1048576).toFixed(1)+' MB'+(mc>0?' · '+t('markers',{n:mc}):'')+(it.done?'':' · '+t('recovered'));
    if(!it.done)d.querySelector('.dot').style.background='var(--gold)';
    const dl=document.createElement('button');dl.className='btn btn-sm btn-gold';dl.textContent=t('download');
    dl.onclick=async()=>{const b=await savedBlob(it.h,mimeOf(it.name));downloadBlob(b,it.name);};
    d.appendChild(dl);
    if(mc>0){const mk=document.createElement('button');mk.className='btn btn-sm';mk.textContent='📍';mk.setAttribute('aria-label',t('mark'));mk.onclick=()=>downloadBlob(new Blob([it.marks],{type:'text/plain'}),it.name.replace(/\.\w+$/,'')+'_markers.txt');d.appendChild(mk);}
    if(navigator.canShare){const sh=document.createElement('button');sh.className='btn btn-sm';sh.textContent=t('share');
      sh.onclick=async()=>{const b=await savedBlob(it.h,mimeOf(it.name));const f=new File([b],it.name,{type:b.type});if(navigator.canShare({files:[f]}))navigator.share({files:[f]}).catch(()=>{});else downloadBlob(b,it.name);};d.appendChild(sh);}
    const del=document.createElement('button');del.className='btn btn-sm btn-danger';del.textContent=t('del');
    del.onclick=async()=>{try{await root.removeEntry(it.name,{recursive:true});}catch(e){}listSaved();};
    d.appendChild(del);
    box.appendChild(d);
  });
}

/* ---------- ICE / TURN ---------- */
async function loadIce(){
  const base=[{urls:'stun:stun.cloudflare.com:3478'},{urls:'stun:stun.l.google.com:19302'}];
  const c=window.PMC_CONFIG||{};
  if(c.meteredApp&&c.meteredApiKey){
    try{const r=await fetch(`https://${c.meteredApp}.metered.live/api/v1/turn/credentials?apiKey=${encodeURIComponent(c.meteredApiKey)}`);const list=await r.json();if(Array.isArray(list)&&list.length){peerOpts.config.iceServers=base.concat(list);return;}}catch(e){}
  }
  if(Array.isArray(c.iceServers)&&c.iceServers.length){peerOpts.config.iceServers=base.concat(c.iceServers);return;}
  peerOpts.config.iceServers=base;
}
const iceReady=loadIce();

/* ================= MASTER ================= */
const LOOKS=[
  {id:'std',name:'Standard',f:'none'},
  {id:'cine',name:'Sinematik',f:'contrast(1.15) saturate(0.82) hue-rotate(-6deg)',bars:true,vig:true},
  {id:'old',name:'Old School',f:'sepia(0.75) contrast(1.1) brightness(0.92)',vig:true,grain:true},

  {id:'drama',name:'Dramatik',f:'contrast(1.45) brightness(0.82) saturate(1.1)',vig:true},
  {id:'soft',name:'Lembut',f:'brightness(1.1) contrast(0.85) saturate(0.9)'}
];
let look=LOOKS[0];
let peers=[], roomCode='', sources=[], mainId=null, secId=null, mode='full';
let statTimer=null;
let recorder=null, saver=null, recStart=0, recTimer=null, drawTimer=null, actx=null, adest=null, aNode=null, localStream=null;

  const lb=$('looks');lb.innerHTML='';
  LOOKS.forEach(l=>{const b=document.createElement('button');const lk=!isPro()&&!FREE_LOOKS.includes(l.id);b.textContent=(lk?'🔒 ':'')+t('l_'+l.id);b.className=l.id===look.id?'on':'';b.onclick=()=>{if(lk){openPro();return;}look=l;track('look',{id:l.id});[...lb.children].forEach(x=>x.classList.toggle('on',x===b));$('lblLook').textContent=t('l_'+l.id);};lb.appendChild(b);});
  $('lblLook').textContent=t('l_'+look.id);

function newCode(){return String(Math.floor(100000+Math.random()*900000));}
async function goMaster(){
  if(!(window.PMC&&PMC.user)){toast(t('loginNeeded'));openAccount();return;}
  applyTier();
  saveName();show('master');keepAwake();track('role_director');
  ensureAudio();
  $('mName').textContent=getName();
  // looks
  renderLooks();
  document.querySelectorAll('#modeSeg button').forEach(b=>b.onclick=()=>{
    mode=b.dataset.m;document.querySelectorAll('#modeSeg button').forEach(x=>x.classList.toggle('on',x===b));
    if(mode!=='full'&&!secId){const o=sources.find(s=>s.id!==mainId&&s.stream);if(o)secId=o.id;}
    renderTiles();sendLive();
  });
  $('aspectSel').onchange=$('qualSel').onchange=resizeStage;
  $('audioSel').onchange=()=>{$('audioSel')._user=true;applyAudio();};
  $('zoom').oninput=e=>{setZoom(Number(e.target.value));$('zoomVal').textContent=Number(e.target.value).toFixed(1)+'×';};

  listSaved();
  await iceReady;
  // code peer (data)
  roomCode=newCode();$('roomCode').textContent=roomCode;
  openPeer(PFX+'code-'+roomCode,true);
  // LAN peer (wifi discovery)
  const key=await lanKey();
  if(key)tryLanSlot(key,1);
}
function tryLanSlot(key,n){
  if(n>LAN_SLOTS)return;
  openPeer(PFX+'lan-'+key+'-'+n,false,()=>tryLanSlot(key,n+1));
}
function openPeer(id,isCode,onTaken){
  const p=new Peer(id,peerOpts);peers.push(p);
  p.on('error',err=>{
    if(err.type==='unavailable-id'){p.destroy();if(isCode){roomCode=newCode();$('roomCode').textContent=roomCode;openPeer(PFX+'code-'+roomCode,true);}else if(onTaken)onTaken();}
  });
  p.on('disconnected',()=>{try{if(!p.destroyed)p.reconnect();}catch(e){}});
  p.on('connection',conn=>{
    conn.on('data',d=>{
      if(!d||!d.t)return;
      if(d.t==='probe'){conn.send({t:'info',name:getName(),cams:sources.length});setTimeout(()=>{try{conn.close();}catch(e){}},1500);return;}
      if(d.t==='hello'&&overLimit(conn.peer)){try{conn.send({t:'full'});}catch(e){}setTimeout(()=>{try{conn.close();}catch(e){}},500);toast(t('limitCams'),4000);return;}
      if(d.t==='hello'){const s=getSrc(conn.peer,d.name);s.conn=conn;s.via=d.via||'wifi';renderTiles();renderConnList();sendLive();conn.send({t:'welcome',name:getName()});}
      if(d.t==='caps'){const s=sources.find(x=>x.id===conn.peer);if(s){s.caps=d;updateZoomUI();}}
      if(d.t==='stat'){const s=sources.find(x=>x.id===conn.peer);if(s){const was=s.batt;s.batt=d.batt;s.charging=d.charging;paintStat(s);if(d.batt<=15&&!d.charging&&(was==null||was>15))toast(t('battLow',{name:s.name,n:d.batt}));}}
    });
    conn.on('close',()=>{const s=sources.find(x=>x.id===conn.peer);if(s&&s.conn===conn)removeSrc(conn.peer);});
  });
  p.on('call',call=>{
    if(overLimit(call.peer)){try{call.close();}catch(e){}return;}
    call.answer();
    call.on('stream',st=>{const s=getSrc(call.peer,call.metadata&&call.metadata.name);s.call=call;if(call.metadata&&call.metadata.via)s.via=call.metadata.via;setStream(s,st);});
    call.on('close',()=>removeSrc(call.peer));
    const pc=call.peerConnection;
    if(pc)pc.addEventListener('iceconnectionstatechange',()=>{if(['failed','closed'].includes(pc.iceConnectionState))removeSrc(call.peer);});
  });
}
function getSrc(id,name){
  let s=sources.find(x=>x.id===id);
  if(!s){
    s={id,name:name||(t('cam')+' '+(sources.length+1)),zoom:1,caps:null,stream:null,via:'wifi',video:document.createElement('video')};
    s.video.muted=true;s.video.playsInline=true;s.video.autoplay=true;s.video.setAttribute('playsinline','');
    sources.push(s);if(!mainId)mainId=id;
    toast(t('joined',{name:s.name}));
  }else if(name)s.name=name;
  renderTiles();
  return s;
}
function setStream(s,st){s.stream=st;s.video.srcObject=st;s.video.play().catch(()=>{});renderTiles();refreshAudio();updateZoomUI();}
function removeSrc(id){
  const i=sources.findIndex(x=>x.id===id);if(i<0)return;
  const s=sources[i];sources.splice(i,1);toast(t('left',{name:s.name}));
  if(mainId===id)mainId=sources[0]?sources[0].id:null;
  if(secId===id)secId=null;
  renderTiles();renderConnList();refreshAudio();sendLive();
}
function viaLabel(v){return v==='data'?t('data'):v==='local'?t('thisPhone'):'Wi-Fi';}
function renderTiles(){

async function pollStats(){
  for(const s of sources){
    const pc=s.call&&s.call.peerConnection;if(!pc)continue;
    try{
      const rep=await pc.getStats();let rtt=null,lost=0,recv=0,relay=false,localId=null;

const MUSIC={
  lofi:{bpm:72,chords:[[60,64,67,71],[57,60,64,67],[53,57,60,64],[55,59,62,65]],cut:900,kick:[0,2.5],snare:[1,3],arp:false},
  ceria:{bpm:108,chords:[[55,59,62],[62,66,69],[64,67,71],[60,64,67]],cut:2400,kick:[0,1,2,3],snare:[1,3],arp:true}

let mTimer=null,mNext=0,mStep=0,mStyle=null,noiseBuf=null;
const mf=n=>440*Math.pow(2,(n-69)/12);
function mNote(freq,t0,dur,type,gain,cut){const o=actx.createOscillator(),g=actx.createGain(),f=actx.createBiquadFilter();o.type=type;o.frequency.value=freq;f.type='lowpass';f.frequency.value=cut;g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(gain,t0+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);o.connect(f);f.connect(g);g.connect(musicGain);o.start(t0);o.stop(t0+dur+0.05);}
function mKick(t0){const o=actx.createOscillator(),g=actx.createGain();o.frequency.setValueAtTime(140,t0);o.frequency.exponentialRampToValueAtTime(45,t0+0.25);g.gain.setValueAtTime(0.45,t0);g.gain.exponentialRampToValueAtTime(0.0001,t0+0.3);o.connect(g);g.connect(musicGain);o.start(t0);o.stop(t0+0.32);}
function mNoise(t0,dur,gain,hp){
  if(!noiseBuf){noiseBuf=actx.createBuffer(1,Math.floor(actx.sampleRate*0.5),actx.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  const src=actx.createBufferSource(),f=actx.createBiquadFilter(),g=actx.createGain();src.buffer=noiseBuf;f.type='highpass';f.frequency.value=hp;g.gain.setValueAtTime(gain,t0);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);src.connect(f);f.connect(g);g.connect(musicGain);src.start(t0);src.stop(t0+dur+0.02);
}
function mSchedule(){
  const st=MUSIC[mStyle];if(!st)return;const spb=60/st.bpm,step=spb/2;
  while(mNext<actx.currentTime+0.3){
    const bar=Math.floor(mStep/8)%4,beat=(mStep%8)/2,ch=st.chords[bar];
    if(mStep%8===0){ch.forEach(n=>mNote(mf(n),mNext,spb*4,'sine',0.045,st.cut));mNote(mf(ch[0]-24),mNext,spb*2,'sine',0.16,400);}
    if(mStep%8===4)mNote(mf(ch[0]-24),mNext,spb*1.5,'sine',0.12,400);
    if(st.arp)mNote(mf(ch[mStep%ch.length]+12),mNext,step*0.9,'triangle',0.04,st.cut);
    else if(mStep%2===1&&Math.random()<0.35)mNote(mf(ch[Math.floor(Math.random()*ch.length)]+12),mNext,spb,'sine',0.03,1500);
    if(st.kick.includes(beat))mKick(mNext);
    if(st.snare.includes(beat))mNoise(mNext,0.18,0.1,1500);
    mNoise(mNext,0.04,mStep%2?0.02:0.035,7000);
    mNext+=step;mStep++;
  }
}

  const turn=(peerOpts.config.iceServers||[]).some(x=>String(x.urls).includes('turn'));
  row(turn?true:null,t('tTurn'),turn?t('tOk'):t('tTurnNo'));
  // battery
  try{if(navigator.getBattery){const b=await navigator.getBattery();const lv=Math.round(b.level*100);row(b.charging||lv>40?true:null,t('tBatt'),lv+'%'+(b.charging?' ⚡':'')+(b.charging||lv>40?'':' · '+t('tBattLow')));}}catch(e){}
  wait.remove();
  const tip=document.createElement('div');tip.className='hint';tip.style.lineHeight='1.5';tip.textContent=t('tTip');box.appendChild(tip);
  track('device_test',{sig,cam:!!st});
}

/* ================= SLAVE ================= */
let sPeer=null,sConn=null,sCall=null,sStream=null,sTarget=null,sVia='wifi',sFacing='environment',sTorch=false,sRetry=null,sKicked=false;
function selTab(name){
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x.dataset.t===name));
  ['wifi','bt','data'].forEach(k=>$('tab-'+k).style.display=k===name?'flex':'none');
  if(name==='wifi')scanMasters();
}
function goSlave(){
  saveName();show('slave');track('role_camera');
  document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>selTab(b.dataset.t));
  scanMasters();
  listSaved('sfiles');
}
function camLabel(){const v=($('camLabel').value||'').trim();try{localStorage.setItem('pmc_label',v);}catch(e){}return v||getName();}
async function ensurePeer(){
  await iceReady;
  return new Promise(res=>{
    if(sPeer&&!sPeer.destroyed&&sPeer.open)return res(sPeer);
    if(sPeer)try{sPeer.destroy();}catch(e){}
    sPeer=new Peer(peerOpts);
    sPeer.on('open',()=>res(sPeer));
    sPeer.on('error',err=>{if(err.type!=='peer-unavailable'&&$('slavecam').classList.contains('show'))sLost();});
    sPeer.on('disconnected',()=>{try{sPeer.reconnect();}catch(e){}});
  });
}
async function scanMasters(){
  const list=$('masterList');list.innerHTML='';
  $('scanMsg').innerHTML='<span class="spin"></span>'+t('scanning');
  const key=await lanKey();
  if(!key){$('scanMsg').textContent=t('noNet');return;}
  const p=await ensurePeer();let found=0;
  const jobs=[];
  for(let n=1;n<=LAN_SLOTS;n++){
    const id=PFX+'lan-'+key+'-'+n;
    jobs.push(new Promise(done=>{
      let c;try{c=p.connect(id,{reliable:true});}catch(e){return done();}
      const to=setTimeout(()=>{try{c.close();}catch(e){}done();},4500);
      c.on('open',()=>c.send({t:'probe'}));
      c.on('data',d=>{if(d&&d.t==='info'){clearTimeout(to);found++;addMasterItem(id,d);try{c.close();}catch(e){}done();}});
      c.on('error',()=>{clearTimeout(to);done();});
    }));
  }
  await Promise.all(jobs);
  $('scanMsg').innerHTML=found?'<span class="dot ok"></span>'+t('found',{n:found}):t('notFound');
}
function addMasterItem(id,info){
  const b=document.createElement('button');b.className='master-item';
  b.innerHTML='<div class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#d9b44a" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4" fill="#d9b44a"/></svg></div><div class="tx"><b></b><span></span></div><span class="go"></span>';
  b.querySelector('b').textContent=info.name||t('dir');b.querySelector('.go').textContent=t('join');
  b.querySelector('.tx span').textContent=t('camsJoined',{n:info.cams||0});
  b.onclick=()=>startSlaveCam(id,'wifi');
  $('masterList').appendChild(b);
}
function joinByCode(){
  const c=$('joinCode').value.replace(/\D/g,'');
  if(c.length!==6){toast(t('enterCode'));return;}
  startSlaveCam(PFX+'code-'+c,'data');
}
async function getCam(){
  return navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:sFacing},width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:30}},audio:{echoCancellation:true,noiseSuppression:true}});
}
function camCaps(){
  const t=sStream&&sStream.getVideoTracks()[0];let c={};try{c=t.getCapabilities?t.getCapabilities():{};}catch(e){}
  const zoom=c.zoom?{min:c.zoom.min,max:c.zoom.max,step:c.zoom.step||0.1}:null;
  $('zoomRow').style.display=zoom?'flex':'none';
  if(zoom){const z=$('camZoom');z.min=zoom.min;z.max=Math.min(zoom.max,10);z.step=zoom.step;z.value=zoom.min;$('camZoomVal').textContent=Number(zoom.min).toFixed(1)+'×';}
  $('torchBtn').disabled=!c.torch;
  $('lockBtn').style.display=lockSupported()?'inline-flex':'none';
  return{zoom,torch:!!c.torch,lock:lockSupported()};
}
async function camZoom(v){const t=sStream&&sStream.getVideoTracks()[0];if(!t)return;try{await t.applyConstraints({advanced:[{zoom:Number(v)}]});$('camZoom').value=v;$('camZoomVal').textContent=Number(v).toFixed(1)+'×';}catch(e){}}
async function camTorch(){const trk=sStream&&sStream.getVideoTracks()[0];if(!trk)return;sTorch=!sTorch;try{await trk.applyConstraints({advanced:[{torch:sTorch}]});}catch(e){toast(t('torchFail'));}}
async function camFlip(){
  sFacing=sFacing==='environment'?'user':'environment';
  try{
    const ns=await getCam(),old=sStream;sStream=ns;$('camVideo').srcObject=ns;
    $('camVideo').style.transform=sFacing==='user'?'scaleX(-1)':'';
    if(sCall&&sCall.peerConnection)for(const s of sCall.peerConnection.getSenders()){if(!s.track)continue;const nt=s.track.kind==='video'?ns.getVideoTracks()[0]:ns.getAudioTracks()[0];if(nt)await s.replaceTrack(nt);}
    if(hdRec&&hdRec.state!=='inactive'){hdRec.stop();setTimeout(()=>hdStart(),300);}
    sLocked=false;$('lockBtn').classList.remove('on');tuneSender();
    old.getTracks().forEach(tr=>tr.stop());
    sSend({t:'caps',...camCaps()});
  }catch(e){toast(t('flipFail'));}
}
/* ---------- camera quality: bitrate, lock, grid, level ---------- */
let sLocked=false,gridOn=true;
function tuneSender(){
  const go=async()=>{
    const pc=sCall&&sCall.peerConnection;if(!pc)return;
    const vt=sStream&&sStream.getVideoTracks()[0];if(vt)try{vt.contentHint='detail';}catch(e){}
    for(const snd of pc.getSenders()){
      if(!snd.track||snd.track.kind!=='video')continue;
      try{const prm=snd.getParameters();if(!prm.encodings||!prm.encodings.length)prm.encodings=[{}];
        prm.encodings[0].maxBitrate=sVia==='data'?2500000:6000000;prm.encodings[0].maxFramerate=30;prm.encodings[0].scaleResolutionDownBy=1;
        prm.degradationPreference='maintain-resolution';await snd.setParameters(prm);}catch(e){}
    }
  };
  setTimeout(go,1500);setTimeout(go,5000);
}
function lockSupported(){const tr=sStream&&sStream.getVideoTracks()[0];let c={};try{c=tr.getCapabilities?tr.getCapabilities():{};}catch(e){}return !!((c.exposureMode&&c.exposureMode.includes('manual'))||(c.whiteBalanceMode&&c.whiteBalanceMode.includes('manual')));}
async function setLock(on){
  const tr=sStream&&sStream.getVideoTracks()[0];if(!tr)return;
  let c={};try{c=tr.getCapabilities?tr.getCapabilities():{};}catch(e){}
  const adv={};
  if(c.exposureMode)adv.exposureMode=on&&c.exposureMode.includes('manual')?'manual':'continuous';
  if(c.whiteBalanceMode)adv.whiteBalanceMode=on&&c.whiteBalanceMode.includes('manual')?'manual':'continuous';
  if(on){const st=tr.getSettings?tr.getSettings():{};if(st.exposureTime&&c.exposureTime)adv.exposureTime=st.exposureTime;if(st.colorTemperature&&c.colorTemperature)adv.colorTemperature=st.colorTemperature;}
  try{await tr.applyConstraints({advanced:[adv]});sLocked=on;$('lockBtn').classList.toggle('on',on);toast(on?t('locked'):t('unlocked'));}catch(e){toast(t('lockFail'));}
}
function toggleLock(){if(!lockSupported()){toast(t('lockFail'));return;}setLock(!sLocked);}
function toggleGrid(){gridOn=!gridOn;$('gridBtn').classList.toggle('on',gridOn);$('gridOv').classList.toggle('show',gridOn);$('levelOv').classList.toggle('show',gridOn);}
function onTilt(e){
  if(e.gamma==null)return;
  const portrait=window.innerHeight>=window.innerWidth;let roll=portrait?e.gamma:e.beta;
  if(!portrait&&(screen.orientation&&screen.orientation.angle===270))roll=-roll;
  roll=Math.max(-45,Math.min(45,roll||0));
  const lv=$('levelOv');lv.style.transform=`translate(-50%,-50%) rotate(${-roll}deg)`;lv.classList.toggle('ok',Math.abs(roll)<2);
  $('levelTxt').textContent=Math.abs(roll)<2?'✓ '+t('level'):Math.round(Math.abs(roll))+'°';
}
function startTilt(){
  try{
    if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){DeviceOrientationEvent.requestPermission().then(r=>{if(r==='granted')window.addEventListener('deviceorientation',onTilt);}).catch(()=>{});}
    else window.addEventListener('deviceorientation',onTilt);
  }catch(e){}
}
let hdRec=null,hdId='',hdPart=0;
function hdStart(id){
  if(hdRec&&hdRec.state!=='inactive')return;
  if(id){hdId=id;hdPart=0;}
  const mime=pickMime(),ext=mime.includes('mp4')?'mp4':'webm';
  const lab=camLabel().replace(/[^\p{L}\p{N}_-]+/gu,'_');
  const sv=new Saver(`ProMultiCam_${hdId}_${lab}${hdPart?'_'+(hdPart+1):''}.${ext}`);hdPart++;
  try{hdRec=new MediaRecorder(sStream,mime?{mimeType:mime,videoBitsPerSecond:10000000,audioBitsPerSecond:128000}:{});}catch(e){return;}
  hdRec.ondataavailable=e=>sv.push(e.data);
  hdRec.onstop=async()=>{const r=await sv.finish(hdRec.mimeType||mime||'video/webm');toast(t('hdSaved',{w:r.where}),4000);};
  hdRec.start(3000);$('hdBadge').classList.add('show');
}
function hdStop(){if(hdRec&&hdRec.state!=='inactive')hdRec.stop();$('hdBadge').classList.remove('show');}
let battObj=null;
async function sendBattery(){
  try{
    if(!battObj&&navigator.getBattery){battObj=await navigator.getBattery();const f=()=>sendBattery();battObj.addEventListener('levelchange',f);battObj.addEventListener('chargingchange',f);}
    if(battObj)sSend({t:'stat',batt:Math.round(battObj.level*100),charging:!!battObj.charging});
  }catch(e){}
}
function sSend(o){try{if(sConn&&sConn.open)sConn.send(o);}catch(e){}}
function sStatus(ok,t){$('camDot').classList.toggle('ok',ok);$('camStatus').textContent=t;}
async function startSlaveCam(target,via){
  if(!sStream){try{sStream=await getCam();}catch(e){toast(t('allowCamMic'));return;}}
  sTarget=target;sVia=via;sKicked=false;
  show('slavecam');keepAwake();
  $('camVideo').srcObject=sStream;$('camAngleLbl').textContent=t('angleLine',{label:camLabel()});
  $('camVia').textContent=via==='data'?t('data'):'Wi-Fi';$('camVia').className='chip '+(via==='data'?'chip-gold':'chip-ok');
  camCaps();$('camZoom').oninput=e=>camZoom(e.target.value);
  $('gridOv').classList.toggle('show',gridOn);$('levelOv').classList.toggle('show',gridOn);startTilt();
  sConnect();
}
async function sConnect(){
  clearTimeout(sRetry);sStatus(false,t('connecting'));
  const p=await ensurePeer();
  sConn=p.connect(sTarget,{reliable:true});
  sConn.on('open',()=>{
    sConn.send({t:'hello',name:camLabel(),via:sVia});
    sCall=p.call(sTarget,sStream,{metadata:{name:camLabel(),via:sVia}});
    tuneSender();
    sCall.on('close',()=>sLost());
    sendBattery();
    sSend({t:'caps',...camCaps()});
  });
  sConn.on('data',d=>{
    if(!d||!d.t)return;
    if(d.t==='welcome')sStatus(true,t('connectedTo',{name:d.name||t('dir')}));
    else if(d.t==='live')$('onAir').classList.toggle('show',!!d.on);
    else if(d.t==='zoom')camZoom(d.v);
    else if(d.t==='lock')setLock(!!d.on);
    else if(d.t==='rec'){if(d.on)hdStart(d.id);else hdStop();}
    else if(d.t==='pause'){try{hdRec&&hdRec.state==='recording'&&hdRec.pause();}catch(e){}}
    else if(d.t==='resume'){try{hdRec&&hdRec.state==='paused'&&hdRec.resume();}catch(e){}}
    else if(d.t==='full'){sKicked=true;toast(t('studioFull'),5000);setTimeout(leave,4000);}
    else if(d.t==='kick'){sKicked=true;toast(t('kicked'));setTimeout(leave,1500);}
  });
  sConn.on('close',()=>sLost());
  sConn.on('error',()=>sLost());
}
function sLost(){
  if(sKicked)return;
  $('onAir').classList.remove('show');sStatus(false,t('lost'));
  clearTimeout(sRetry);sRetry=setTimeout(sConnect,3000);
}

initLang();applyI18n();initInstall();
(function(){
  const jc=(new URLSearchParams(location.search).get('join')||'').replace(/\D/g,'');
  if(jc.length===6){history.replaceState(null,'',location.pathname);goSlave();selTab('data');$('joinCode').value=jc;toast(t('qrReady'),4000);track('join_link');return;}
  if(lsGet('pmc_guided','')!=='1')openGuide();
})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
