name: Build APK

# Builds the native Android app (android/) and publishes it on the "apk" branch,
# then runs the Firebase deploy so the APK page offers the new file.
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml', 'public/manual.js', 'public/manual/**']
  workflow_dispatch: {}

concurrency:
  group: build-apk
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Fonts for the brand designs (open-licence Google Fonts, same as the web)
        run: |
          d=android/app/src/main/assets/fonts; mkdir -p $d
          g=https://raw.githubusercontent.com/google/fonts/main/ofl
          get(){ curl -fsSL -o "$d/$1" "$g/$2" || echo "font $1 missing"; }
          get bricolage.ttf "bricolagegrotesque/BricolageGrotesque%5Bopsz%2Cwdth%2Cwght%5D.ttf"
          get poppins.ttf "poppins/Poppins-Bold.ttf"
          get montserrat.ttf "montserrat/Montserrat%5Bwght%5D.ttf"
          get bebas.ttf "bebasneue/BebasNeue-Regular.ttf"
          get anton.ttf "anton/Anton-Regular.ttf"
          get playfair.ttf "playfairdisplay/PlayfairDisplay%5Bwght%5D.ttf"
          get lobster.ttf "lobster/Lobster-Regular.ttf"
          get pacifico.ttf "pacifico/Pacifico-Regular.ttf"
          get dancing.ttf "dancingscript/DancingScript%5Bwght%5D.ttf"
          curl -fsSL -o "$d/marker.ttf" "https://raw.githubusercontent.com/google/fonts/main/apache/permanentmarker/PermanentMarker-Regular.ttf" || echo "font marker missing"
          ls -la $d
      - name: Manual (same as the web)
        run: |
          node android/tools/manual.js public/manual.js android/app/src/main/assets/manual
          cp public/manual/*.jpg android/app/src/main/assets/manual/
      - name: Build
        env:
          PMC_VERSION_CODE: ${{ github.run_number }}
        run: gradle -p android assembleRelease --no-daemon --stacktrace
      - name: Publish to the apk branch
        if: github.ref == 'refs/heads/main'
        env:
          N: ${{ github.run_number }}
        run: |
          mkdir out
          cp android/app/build/outputs/apk/release/app-release.apk out/ProMultiCam.apk
          MB=$(python3 -c "import os;print(round(os.path.getsize('out/ProMultiCam.apk')/1048576,1))")
          printf '{"v":"0.1.%s","code":%s,"date":"%s","mb":%s}' "$N" "$N" "$(date -u +%Y-%m-%d)" "$MB" > out/version.json
          cd out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -qm "APK 0.1.$N"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk
      - name: Deploy the site with the new APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main -R "${{ github.repository }}"
