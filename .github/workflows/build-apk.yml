name: Build ProMultiCam APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Sediakan projek Capacitor
        run: |
          mkdir -p build/www
          cp index.html manifest.json sw.js icon-192.png icon-512.png build/www/
          cd build
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6
          npx cap init "ProMultiCam" com.alemmaxx.promulticam --web-dir www
          npx cap add android
          MAN=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />#' $MAN
          sed -i 's#<application#<application android:requestLegacyExternalStorage="true"#' $MAN
          grep -n "permission" $MAN
          # Ikon app
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for f in ic_launcher.png ic_launcher_round.png ic_launcher_foreground.png; do
              [ -f android/app/src/main/res/mipmap-$d/$f ] && cp www/icon-512.png android/app/src/main/res/mipmap-$d/$f
            done
          done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          npx cap sync android

      - name: Bina APK
        run: |
          cd build/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../ProMultiCam.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ProMultiCam-APK
          path: ProMultiCam.apk
