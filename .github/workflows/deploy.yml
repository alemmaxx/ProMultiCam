name: Deploy to Firebase

# Deploys the web app, database rules and Cloud Functions.
# Runs only when the repo secret FIREBASE_SERVICE_ACCOUNT is set
# (a Firebase service-account JSON). The project ID is read from that JSON.
# Without the secret, GitHub Pages keeps serving the app.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-hosting
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
      SITE: promulticam
    steps:
      - name: Skip (no secret)
        if: env.HAS_SA != 'true'
        run: echo "FIREBASE_SERVICE_ACCOUNT not set - skipping deploy."

      - uses: actions/checkout@v4
        if: env.HAS_SA == 'true'

      - uses: actions/setup-node@v4
        if: env.HAS_SA == 'true'
        with:
          node-version: 22

      - name: Credentials and project
        if: env.HAS_SA == 'true'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          PID=$(jq -r .project_id "$RUNNER_TEMP/sa.json")
          echo "::add-mask::$PID"
          echo "PID=$PID" >> "$GITHUB_ENV"
          printf '{"projects":{"default":"%s"},"targets":{"%s":{"hosting":{"promulticam":["%s"]}}}}' "$PID" "$PID" "$SITE" > .firebaserc

      - name: Install functions dependencies
        if: env.HAS_SA == 'true'
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Create hosting site (if missing)
        if: env.HAS_SA == 'true'
        run: npx --yes firebase-tools@latest hosting:sites:create "$SITE" --project "$PID" --non-interactive || true

      - name: Add the APK (built by the Build APK workflow)
        if: env.HAS_SA == 'true'
        run: |
          mkdir -p public/apk
          if git fetch -q --depth=1 origin apk; then
            git show origin/apk:ProMultiCam.apk > public/apk/ProMultiCam.apk
            git show origin/apk:version.json > public/apk/version.json
          else echo "no APK yet"; fi

      - name: Deploy
        if: env.HAS_SA == 'true'
        run: npx --yes firebase-tools@latest deploy --project "$PID" --only hosting:promulticam,firestore:promulticam,functions:promulticam --non-interactive --force

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
